m(bal)} poin</span></label></div><div class="text-xs text-slate-500">${st.customer?`Customer ${esc(st.customer.id)} · ${num(st.customer.transactions)} transaksi · total ${money(st.customer.total_spent)} · saldo ${num(st.customer.points_balance)} poin`:'Pilih customer untuk melihat riwayat dan saldo poin.'}</div></section><aside class="card p-5 h-fit xl:sticky xl:top-24"><h3 class="font-black">Ringkasan Pesanan</h3><div class="space-y-3 mt-5 text-sm"><div class="flex justify-between"><span>Subtotal</span><b>${money(p.sub)}</b></div><div class="flex justify-between"><span>Diskon</span><b>− ${money(p.disc)}</b></div><div class="flex justify-between"><span>Potongan Poin</span><b>− ${money(p.pd)}</b></div><div class="border-t pt-3 flex justify-between text-lg"><b>Total Bayar</b><b>${money(p.total)}</b></div><div class="flex justify-between"><span>Poin diperoleh</span><b>${num(p.earned)}</b></div><div class="flex justify-between"><span>Sisa tagihan</span><b>${money(f.payment==='Lunas'?0:Math.max(0,p.total-Number(f.dp||0)))}</b></div></div><button class="btn primary w-full mt-6" id="save-order">Simpan Pesanan</button></aside></form>`}

function parseDate(v){if(v===null||v===undefined||v==='')return null;if(typeof v==='number'){const d=new Date(Date.UTC(1899,11,30)+v*86400000);return d.toISOString().slice(0,10)}const s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;const d=new Date(s);return Number.isNaN(d.getTime())?null:d.toISOString().slice(0,10)}
const aliasMap={id:['ID Transaksi','ID','id'],date:['Tanggal','date'],customer_id:['Customer ID','customer_id'],customer_name:['Customer','Nama Customer','customer_name'],customer_phone:['No HP','Telepon','customer_phone'],customer_email:['Email','customer_email'],customer_address:['Alamat','customer_address'],book_id:['Book ID','ID Buku','book_id'],book_title:['Buku','Judul Buku','book_title'],qty:['Qty','Jumlah','qty'],unit_price:['Harga Satuan','unit_price'],shipping_cost:['Ongkir','shipping_cost'],subtotal:['Subtotal','subtotal'],discount_percent:['Diskon %','discount_percent'],discount:['Diskon','discount_amount'],points_used:['Poin','points_used'],points_discount:['Potongan Poin','points_discount'],points_earned:['Poin Diperoleh','points_earned'],total_price:['Total Bayar','total_price'],status:['Status Transaksi','status'],payment_status:['Status Pembayaran','payment_status'],dp_amount:['DP Amount','dp_amount'],shipping_vendor:['Vendor Ekspedisi','shipping_vendor'],tracking_number:['Nomor Resi','tracking_number']};
function normalizeImportRow(raw){const r={};Object.entries(aliasMap).forEach(([k,aliases])=>{for(const a of aliases){if(raw[a]!==undefined&&raw[a]!==null&&String(raw[a]).trim()!==''){r[k]=raw[a];break}}});r.date=parseDate(r.date);return r}
async function buildImportPreview(rows){const existing=await fetchAllOrders(),byId=new Map(existing.map(x=>[String(x.id).toUpperCase(),x]));const books=new Map(st.books.map(x=>[String(x.id).toLowerCase(),x])),titles=new Map(st.books.map(x=>[String(x.title).toLowerCase(),x]));const preview=[];for(let i=0;i<rows.length;i++){const r=normalizeImportRow(rows[i]),reasons=[];let book=books.get(String(r.book_id||'').toLowerCase());if(!book&&r.book_title)book=titles.get(String(r.book_title).toLowerCase());if(!book)reasons.push('Buku tidak ditemukan');const qty=Number(r.qty||0);if(qty<=0)reasons.push('Qty harus lebih dari 0');if(!String(r.customer_name||'').trim())reasons.push('Customer wajib diisi');if(r.status&&!TS.includes(String(r.status)))reasons.push('Status transaksi tidak valid');if(r.payment_status&&!PS.includes(String(r.payment_status)))reasons.push('Status pembayaran tidak valid');if(!r.date)reasons.push('Tanggal tidak valid');const id=r.id?String(r.id).toUpperCase():'';const type=reasons.length?'skipped':(id&&byId.has(id)?'update':'new');preview.push({row:i+2,type,reasons,data:{...r,book_id:book?.id||r.book_id,book_title:book?.title||r.book_title,id:id||`ORD-PENDING-${i+1}`}})}return preview}

async function uploadCoverFile(file,bookId){if(!file)return;if(file.size>8*1024*1024)return toast('Ukuran cover maksimal 8 MB.','error');if(!['image/jpeg','image/png','image/webp'].includes(file.type))return toast('Tipe cover harus JPG, PNG, atau WebP.','error');if(!bookId){st.pendingCover=file;const url=URL.createObjectURL(file);const preview=$('#cover-preview');if(preview){const img=preview.querySelector('img');if(img)img.src=url;else{const holder=preview.querySelector('.cover-placeholder');if(holder){const n=document.createElement('img');n.src=url;n.className='cover w-40 rounded-xl';n.alt='Preview cover';holder.replaceWith(n)}}}const status=$('#cover-status');if(status)status.textContent='Cover dipilih. Simpan buku untuk mengunggahnya ke Storage.';return;}const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=URL.createObjectURL(file)});const scale=Math.min(900/img.width,1200/img.height,1),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);URL.revokeObjectURL(img.src);const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.82));if(!blob)throw new Error('Gagal kompres cover');const path=`${bookId}.jpg`;const progress=$('#cover-progress'),bar=$('#cover-bar'),pct=$('#cover-percent');progress?.classList.remove('hidden');const xhr=new XMLHttpRequest();await new Promise((resolve,reject)=>{xhr.open('POST',`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${encodeURIComponent(path)}`);xhr.setRequestHeader('apikey',SUPABASE_ANON_KEY);xhr.setRequestHeader('Authorization','Bearer '+SUPABASE_ANON_KEY);xhr.setRequestHeader('Content-Type','image/jpeg');xhr.setRequestHeader('x-upsert','true');xhr.upload.onprogress=e=>{if(e.lengthComputable){const n=Math.round(e.loaded/e.total*100);if(bar)bar.style.width=n+'%';if(pct)pct.textContent=n+'%'}};xhr.onload=()=>xhr.status>=200&&xhr.status<300?resolve():reject(new Error('Upload cover gagal ('+xhr.status+')'));xhr.onerror=()=>reject(new Error('Upload cover gagal karena jaringan.'));xhr.send(blob)});try{await api.cover(bookId,path,Date.now());toast('Cover berhasil diunggah.','success');st.book={...st.book,coverPath:path,coverVersion:Date.now()};await bootstrap();render()}catch(e){await sb.storage.from(BUCKET).remove([path]);throw e}finally{progress?.classList.add('hidden')}}
async function removeCover(){const b=st.book;if(!b?.id||!b.coverPath)return;try{const old=b.coverPath;const {error}=await sb.storage.from(BUCKET).remove([old]);if(error)throw error;await api.cover(b.id,'',Date.now());toast('Cover dihapus.','success');st.book={...b,coverPath:'',coverVersion:null};await bootstrap();render()}catch(e){handleError(e)}}

document.addEventListener('click',async e=>{const a=e.target.closest('[data-a]');if(!a)return;const x=a.dataset.a;try{if(x==='close'){closeModal();return}if(x==='close-toast'){a.closest('.toast')?.remove();return}if(x==='retry'){a.closest('.toast')?.remove();if(st.user)await renderView();return}if(x==='toggle'){const q=$('#'+a.dataset.id);q.type=q.type==='password'?'text':'password';return}if(x==='nav'){if(a.dataset.v==='book-form'){st.book=null;st.pendingCover=null;}navigate(a.dataset.v);return}if(x==='drawer'){st.drawerOpen=!st.drawerOpen;shell();renderView();return}if(x==='reload'){const old=a.innerHTML;setButtonBusy(a,true,'Reload…');try{await bootstrap();await renderView()}finally{setButtonBusy(a,false);a.innerHTML=old}return}if(x==='logout'){try{await api.logout()}catch{}clearSession();st.user=null;st.unsaved=false;window.onbeforeunload=null;login();return}if(x==='detail'){await detail(a.dataset.id);return}if(x==='timeline'){const o=await api.detail(a.dataset.id);modal(`<div class="p-5"><h2 class="text-xl font-black">Timeline · ${esc(o.id)}</h2><div class="space-y-3 mt-5">${(o.history||[]).map(h=>`<div class="flex gap-3"><span class="w-2 h-2 rounded-full bg-blue-600 mt-2"></span><div><b>${esc(h.kind==='transaction'?'Status: ':'Pembayaran: ')}${esc(h.status)}</b><div class="text-xs text-slate-500">${dateID(h.status_date)}${h.status===o.status&&h.kind==='transaction'?' · STATUS SAAT INI':''}</div></div></div>`).join('')}</div></div>`);return}if(x==='edit-status'){const o=st.detail?.id===a.dataset.id?st.detail:await api.detail(a.dataset.id);st.detail=o;statusForm(o);return}if(x==='shipping'){const o=st.detail?.id===a.dataset.id?st.detail:await api.detail(a.dataset.id);st.detail=o;shippingForm(o);return}if(x==='delete-order'){confirmText('Hapus Pesanan',`Hapus ${a.dataset.id}? Stok akan dikembalikan jika transaksi dibuat oleh aplikasi.`, 'Hapus',async()=>{await api.deleteOrder(a.dataset.id);toast('Pesanan dihapus.','success');closeModal();st.detail=null;await rend
