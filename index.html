<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YKBUT Press Order Management System V21</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->

    <!-- PDF Report: jsPDF + AutoTable -->

    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'corp-primary': '#1D4ED8',
                        'corp-dark': '#0F172A',
                        'corp-light': '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /*
         * Thermal receipt printing
         * Physical paper: 58 mm
         * Typical printable area: +/- 48 mm (5 mm margin each side)
         * UI remains unchanged because these rules only apply to print media.
         */
        @media print {
            @page {
                size: 58mm auto;
                margin: 0;
            }

            html, body {
                width: 58mm !important;
                min-width: 58mm !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #fff !important;
            }

            body * {
                visibility: hidden !important;
            }

            #print-area, #print-area * {
                visibility: visible !important;
            }

            /* Important: the element is hidden on screen via Tailwind's .hidden.
               display:block here is required so Chromium/Edge can actually print it. */
            #print-area {
                display: block !important;
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 58mm !important;
                max-width: 58mm !important;
                min-width: 58mm !important;
                box-sizing: border-box !important;
                margin: 0 !important;
                padding: 5mm !important;
                background: #fff !important;
                color: #000 !important;
                overflow: visible !important;
                font-family: 'Courier New', Courier, monospace !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            #print-area .thermal-receipt {
                width: 100% !important;
                max-width: 48mm !important;
                min-width: 0 !important;
                margin: 0 auto !important;
                padding: 0 !important;
                box-sizing: border-box !important;
                color: #000 !important;
                background: #fff !important;
                font-family: 'Courier New', Courier, monospace !important;
                font-size: 11px !important;
                line-height: 1.25 !important;
                word-break: normal;
                overflow-wrap: anywhere;
            }

            #print-area .thermal-receipt * {
                box-sizing: border-box;
            }

            #print-area .thermal-receipt .receipt-title {
                font-size: 16px !important;
                line-height: 1.15 !important;
                font-weight: 900 !important;
            }

            #print-area .thermal-receipt .receipt-small {
                font-size: 9px !important;
                line-height: 1.25 !important;
            }

            #print-area .thermal-receipt .receipt-label {
                font-size: 10px !important;
                line-height: 1.25 !important;
            }

            #print-area .thermal-receipt .receipt-total {
                font-size: 13px !important;
                line-height: 1.2 !important;
                font-weight: 900 !important;
            }

            #print-area .thermal-receipt .receipt-payment {
                font-size: 10px !important;
                line-height: 1.25 !important;
            }

            #print-area .thermal-receipt .receipt-divider {
                border-color: #000 !important;
                border-style: dashed !important;
            }

            #print-area .thermal-receipt .receipt-row {
                display: flex !important;
                justify-content: space-between !important;
                align-items: flex-start !important;
                gap: 8px !important;
                width: 100% !important;
            }

            #print-area .thermal-receipt .receipt-row > :first-child {
                min-width: 0;
                flex: 1 1 auto;
            }

            #print-area .thermal-receipt .receipt-row > :last-child {
                flex: 0 0 auto;
                text-align: right;
                white-space: nowrap;
            }

            #print-area .thermal-receipt .receipt-book-title {
                font-weight: 700 !important;
                white-space: normal !important;
                overflow-wrap: anywhere;
            }

            #print-area .thermal-receipt .receipt-address {
                white-space: pre-line !important;
                overflow-wrap: anywhere;
            }

            #print-area .thermal-receipt .receipt-no-break {
                break-inside: avoid !important;
                page-break-inside: avoid !important;
            }

            .print-bg-none { background: none !important; }
        }
        
        .fade-in {
            animation: fadeIn 0.25s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            height: 260px;
            max-height: 320px;
        }


        /* =========================================================
         * Responsive UI/UX
         * Desktop tetap menggunakan layout asli.
         * Mobile: sidebar menjadi drawer, header lebih ringkas,
         * kartu/form/modal/chart menyesuaikan layar.
         * ========================================================= */
        html, body {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
        }

        button, input, select, textarea {
            -webkit-tap-highlight-color: transparent;
        }

        button {
            touch-action: manipulation;
        }

        input, select, textarea {
            max-width: 100%;
        }

        #app-content {
            min-width: 0;
            -webkit-overflow-scrolling: touch;
        }

        #app-content > * {
            min-width: 0;
        }

        .responsive-table-wrap {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }

        #mobile-menu-toggle,
        #mobile-sidebar-overlay {
            display: none;
        }

        @media (max-width: 767px) {
            body {
                height: 100dvh;
                min-height: 100dvh;
                overflow: hidden;
            }

            /* Sidebar menjadi drawer tanpa mengubah menu desktop. */
            body > aside {
                position: fixed;
                inset: 0 auto 0 0;
                width: min(82vw, 300px) !important;
                height: 100dvh;
                z-index: 60;
                transform: translateX(-105%);
                transition: transform .25s ease;
                box-shadow: 12px 0 30px rgba(15, 23, 42, .22);
                padding-bottom: env(safe-area-inset-bottom);
            }

            body.mobile-sidebar-open > aside {
                transform: translateX(0);
            }

            #mobile-sidebar-overlay {
                display: block;
                position: fixed;
                inset: 0;
                background: rgba(15, 23, 42, .48);
                z-index: 55;
                opacity: 0;
                pointer-events: none;
                transition: opacity .25s ease;
            }

            body.mobile-sidebar-open #mobile-sidebar-overlay {
                opacity: 1;
                pointer-events: auto;
            }

            body > aside nav {
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            /* Area aplikasi utama memenuhi layar. */
            body > div.flex-1.flex.flex-col {
                width: 100%;
                min-width: 0;
                height: 100dvh;
            }

            header {
                height: auto !important;
                min-height: 64px;
                padding: 10px 12px !important;
                border-bottom-width: 3px !important;
                flex-wrap: wrap;
                gap: 8px;
                padding-top: max(10px, env(safe-area-inset-top));
            }

            header > div:first-child {
                width: 100%;
                min-width: 0;
                gap: 8px !important;
            }

            header > div:first-child > #page-title {
                min-width: 0;
                flex: 1 1 auto;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                font-size: 16px !important;
            }

            #mobile-menu-toggle {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                flex: 0 0 40px;
                width: 40px;
                height: 40px;
                border-radius: 10px;
                background: #0F172A;
                color: #fff;
                font-size: 21px;
                box-shadow: 0 2px 6px rgba(15,23,42,.15);
            }

            #sync-status-badge {
                max-width: 55vw;
                overflow: hidden;
                white-space: nowrap;
                text-overflow: ellipsis;
                padding-left: 8px !important;
                padding-right: 8px !important;
            }

            header > .header-actions {
                width: 100%;
                min-width: 0;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                display: flex;
                gap: 8px;
                padding-bottom: 2px;
                scrollbar-width: none;
            }

            header > .header-actions::-webkit-scrollbar {
                display: none;
            }

            header > .header-actions > button {
                flex: 0 0 auto;
                min-height: 38px;
            }

            header > .header-actions > span {
                flex: 0 0 auto;
                white-space: nowrap;
                margin-left: 0 !important;
                padding-left: 8px !important;
            }

            #app-content {
                padding: 16px !important;
                padding-bottom: max(16px, env(safe-area-inset-bottom)) !important;
            }

            /* Dashboard */
            #app-content .grid.grid-cols-1.sm\:grid-cols-2.lg\:grid-cols-5 {
                grid-template-columns: 1fr !important;
                gap: 12px !important;
            }

            #app-content .grid.grid-cols-1.lg\:grid-cols-2 {
                grid-template-columns: 1fr !important;
                gap: 16px !important;
            }

            #app-content .bg-white.rounded-xl.shadow-sm.border-l-4.p-6 {
                padding: 16px !important;
            }

            #app-content h3 {
                line-height: 1.25;
            }

            .chart-container {
                height: 235px;
                max-height: 260px;
            }

            #monthlyOrdersChart {
                min-height: 225px;
            }

            /* Kartu ringkasan status tetap 2 kolom agar ringkas di HP. */
            #app-content .grid.grid-cols-2.sm\:grid-cols-4 {
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            }

            /* Form tetap mengikuti breakpoint Tailwind, tetapi lebih nyaman disentuh. */
            #app-content input,
            #app-content select,
            #app-content textarea,
            #modal-root input,
            #modal-root select,
            #modal-root textarea {
                font-size: 16px !important;
            }

            /* Tabel tidak dipaksa mengecil sampai sulit dibaca. Scroll horizontal. */
            #app-content .overflow-x-auto {
                overflow-x: auto !important;
                -webkit-overflow-scrolling: touch;
            }

            #app-content .overflow-x-auto table {
                min-width: 900px;
            }

            /* Daftar kartu/elemen flex tidak menyebabkan horizontal overflow. */
            #app-content .flex.justify-between.items-center {
                min-width: 0;
            }

            #app-content .flex.justify-between.items-center > * {
                min-width: 0;
            }

            /* Modal nyaman di layar kecil dan tetap dapat discroll. */
            #modal-root > div {
                padding: 12px !important;
                align-items: center !important;
            }

            #modal-root > div > div {
                width: 100% !important;
                max-width: calc(100vw - 24px) !important;
                max-height: calc(100dvh - 24px) !important;
                overflow-y: auto !important;
                -webkit-overflow-scrolling: touch;
            }

            /* Modal konfigurasi yang memiliki konten panjang. */
            #sheet-config-modal {
                padding: 12px !important;
            }

            /* Login tetap proporsional pada HP. */
            #login-screen {
                padding: 16px;
            }

            #login-screen > div {
                width: 100% !important;
                max-width: 420px !important;
                padding: 24px !important;
            }

            /* Toast tidak menutupi seluruh layar. */
            #toast-container {
                top: max(10px, env(safe-area-inset-top)) !important;
                left: 12px !important;
                right: 12px !important;
            }

            #toast-container > div {
                max-width: 100% !important;
            }
        }

        @media (min-width: 768px) {
            #mobile-menu-toggle,
            #mobile-sidebar-overlay {
                display: none !important;
            }
        }



        @media (max-width: 767px) and (orientation: landscape) {
            header {
                padding-top: 6px !important;
                padding-bottom: 6px !important;
            }
            #app-content {
                padding-top: 12px !important;
            }
            .chart-container {
                height: 190px;
            }
        }

        @media (max-width: 380px) {
            #app-content {
                padding: 12px !important;
            }

            #app-content .bg-white.rounded-xl.shadow-sm.border-l-4.p-6 {
                padding: 14px !important;
            }

            .chart-container {
                height: 215px;
            }
        }
    </style>
</head>

    <script>
        const SPREADSHEET_CONFIG = {
            TARGET_SHEET_ID: "115m5DYcwSiH6cEOkIBWgdsBG_59a6SPHyWj4V0EZqp8",
            DEFAULT_WEB_APP_URL: "https://script.google.com/macros/s/AKfycbwzG-MzCnvZhzYZdO2sPCFGwu10uDLRQNHSXMaOwJTf79utt70zlZQ-8TO8HHn25b1I/exec"
        };

        function isValidWebAppUrl(url) {
            return /^https:\/\/script\.google\.com\/macros\/s\/[^\s/]+\/exec(?:\?.*)?$/i.test(String(url || '').trim());
        }

        function getWebAppUrl() {
            // V18.1 FINAL: gunakan deployment terbaru sebagai default dan migrasikan
            // URL deployment lama yang pernah tersimpan di browser. URL yang tersimpan
            // secara manual tetap dipertahankan selama bukan salah satu URL legacy.
            const storedUrl = String(localStorage.getItem('ykbut_webapp_url') || '').trim();
            const legacyUrls = new Set([
                'https://script.google.com/macros/s/AKfycbwgtF-7VKmf9NYemPsxZ7C24BWi2TEUmIXdSnB0cioMjWf9YXuMk9yUmTeI1fVlaJq9/exec'
            ]);

            if (!storedUrl || legacyUrls.has(storedUrl) || !isValidWebAppUrl(storedUrl)) {
                localStorage.setItem('ykbut_webapp_url', SPREADSHEET_CONFIG.DEFAULT_WEB_APP_URL);
                return SPREADSHEET_CONFIG.DEFAULT_WEB_APP_URL;
            }

            return storedUrl;
        }

        const SYNC_ENGINE_VERSION = 'V20_SERVER_AUTHORITATIVE_NO_STALE_TOMBSTONES';
        const SERVER_EXPECTED_VERSION = 'YKBUT-PRESS-SERVER-V11';
        const FINGERPRINT_EXCLUDED_KEYS = new Set(['isNewOrder','isNewCustomer','pendingDisplayNo','localChangedAt']);

        const canonicalizeOrderForFingerprint = (order) => {

            for (let i = 0; i < payload.length; i++) {

                hash = (hash * 16777619) >>> 0;

            return ('00000000' + hash.toString(16)).slice(-8);

        function calculateOrderWithShipping(order, newShipping) {
            const shippingCost = Math.max(0, Number(newShipping) || 0);
            const qty = Math.max(0, Number(order?.qty || 0));
            const unitPrice = Math.max(0, Number(order?.unitPrice || 0));
            const subtotal = (qty * unitPrice) + shippingCost;
            const rawDiscountPercent = Number(order?.discountPercent || 0);
            const discountPercent = Math.max(0, Number.isFinite(rawDiscountPercent) ? rawDiscountPercent : 0);
            let discountAmount = Math.min(subtotal, subtotal * discountPercent / 100);
            if (discountPercent === 0 && Number(order?.discountAmount || 0) > 0) {
                discountAmount = Math.min(subtotal, Math.max(0, Number(order.discountAmount || 0)));
            }
            const pointsUsed = Math.max(0, parseInt(order?.pointsUsed || 0, 10) || 0);
            const pointValue = Number(appData.settings?.pointValue || DEFAULT_LOYALTY_SETTINGS.pointValue || 100);
            const pointsDiscount = Math.min(Math.max(0, subtotal - discountAmount), pointsUsed * pointValue);
            const totalPrice = Math.max(0, subtotal - discountAmount - pointsDiscount);
            const pointsEarned = Math.floor(totalPrice / Math.max(1, Number(appData.settings?.rupiahPerPoint || DEFAULT_LOYALTY_SETTINGS.rupiahPerPoint || 10000)));
            return { shippingCost, subtotal, discountPercent, discountAmount, pointsUsed, pointsDiscount, totalPrice, pointsEarned };
        }

            orders.forEach(o => {

                const m = /^ORD-(\d+)$/.exec(id);
                if (m) {
                    const n = Number(m[1]);
                    if (Number.isFinite(n)) {
                        used.add(n);
                        if (n > maxNo) maxNo = n;
                    }
                }
            });
            orders.forEach(o => {
                if (!String(o?.id || '').startsWith('ORD-PENDING-')) return;
                const existing = Number(o.pendingDisplayNo);
                if (Number.isFinite(existing) && existing > 0 && !used.has(existing)) {
                    used.add(existing);
                    if (existing > maxNo) maxNo = existing;
                    return;
                }
                do { maxNo += 1; } while (used.has(maxNo));
                o.pendingDisplayNo = maxNo;
                used.add(maxNo);
            });
        }

                if (!order || !order.id) return;
                const queued = {

                    clientRequestId: order.clientRequestId || ((window.crypto && crypto.randomUUID) ? crypto.randomUUID() : `REQ-${Date.now()}-${Math.random().toString(36).slice(2)}`),
                    localChangedAt: Date.now()

            async syncPendingOrders() {
                const ids = Object.keys(pendingOrderSync);
                if (!ids.length) return { success: 0, failed: 0 };
                let success = 0, failed = 0;
                for (const id of ids) {
                    const order = pendingOrderSync[id];
                    if (!order) { delete pendingOrderSync[id]; continue; }
                    try {
                        const res = await apiService.sendAction('saveOrder', order);
                        if (res && res.status === 'success') {
                            const finalId = String(res.id || id);
                            if (finalId !== String(id)) {
                                const local = appData.orders.find(o => String(o.id) === String(id));
                                if (local) local.id = finalId;
                                const hist = orderHistories[id];
                                if (hist) { orderHistories[finalId] = hist; delete orderHistories[id]; saveOrderHistories(); }
                                pendingOrderSync[finalId] = { ...order, id: finalId, isNewOrder:false };
                                delete pendingOrderSync[id];
                            }
                            if (res.customerId) {
                                const local = appData.orders.find(o => String(o.id) === String(finalId));
                                if (local) {
                                    local.customerId = res.customerId;
                                    local.isNewCustomer = false;
                                }
                            }
                            if (Array.isArray(confirmedServerOrders)) {
                                const idx = confirmedServerOrders.findIndex(o => String(o.id) === String(finalId));
                                const saved = { ...order, id: finalId, isNewOrder:false, ...(res.customerId ? { customerId: res.customerId, isNewCustomer: false } : {}) };
                                if (idx >= 0) confirmedServerOrders[idx] = saved; else confirmedServerOrders.push(saved);
                            }
                            delete pendingOrderSync[id];
                            success++;
                        } else {
                            failed++;
                        }
                    } catch (err) {
                        console.warn('Pending order sync gagal:', id, err);
                        failed++;
                    }
                    this.saveLocalStorage();
                }
                return { success, failed };

                        checking: ['bg-blue-50 text-blue-700 border-blue-200', 'bg-blue-500', true],
                        success: ['bg-green-50 text-green-700 border-green-200 hover:bg-green-100', 'bg-green-500', false],
                        warning: ['bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100', 'bg-amber-500', false],
                        error: ['bg-red-50 text-red-700 border-red-200 hover:bg-red-100', 'bg-red-500', false]
                    };
                    const cfg = styles[kind] || styles.warning;
                    badge.className = `flex items-center space-x-1.5 px-3 py-1 rounded-full text-xs font-semibold ${cfg[0]} transition`;
                    badgeDot.className = `w-2 h-2 rounded-full ${cfg[1]}${cfg[2] ? ' animate-ping' : ''}`;
                    badgeText.innerText = text;
                    if (title) badge.title = title;
                };

                if(syncIcon) syncIcon.classList.add('animate-spin');
                setBadge('checking', 'Mengecek Koneksi...', 'Mengambil snapshot terbaru dari Google Sheets.');

                // Local data hanya dipakai sebagai fallback/offline cache dan untuk
                // mempertahankan transaksi yang benar-benar masih berada di pending queue.
                const localOrdersSnapshot = Array.isArray(appData.orders) ? appData.orders.map(o => ({ ...o })) : [];
                const localOrdersById = new Map(localOrdersSnapshot.map(o => [String(o.id), o]));
                let serverData = await apiService.fetchAll();

                if(syncIcon) syncIcon.classList.remove('animate-spin');

                if (!(serverData && serverData.status === 'success')) {
                    lastSyncMeta = {
                        engineVersion: SYNC_ENGINE_VERSION,
                        status: 'offline',
                        at: new Date().toISOString(),
                        message: serverData?.message || 'Server tidak dapat diakses'
                    };
                    this.saveLocalStorage();
                    setBadge('warning', serverData?.status === 'unconfigured' ? 'Belum Terhubung (URL Kosong)' : 'Belum Terhubung (Data Lokal Dipertahankan)', 'Google Sheets belum berhasil diakses. Data lokal dipertahankan sebagai fallback.');
                    syncInProgress = false;
                    return;
                }

                const initialDuplicateIds = findDuplicateOrderIds(serverData.orders);
                if (initialDuplicateIds.length > 0) {
                    const repair = await apiService.sendAction('repairDuplicateOrderIds', {});
                    if (repair && repair.status === 'success' && Number(repair.repairedCount || 0) > 0) {
                        showToast(`ID transaksi duplikat diperbaiki: ${repair.repairedCount} data dibuat unik.`, 'success');
                        const refreshed = await apiService.fetchAll();
                        if (refreshed && refreshed.status === 'success') serverData = refreshed;
                    } else if (repair && repair.status !== 'success') {
                        showToast('Ditemukan ID transaksi duplikat. Update Apps Script ke V11 diperlukan.', 'error');
                    }
                }

                const rawServerOrders = Array.isArray(serverData.orders) ? serverData.orders : [];
                // Kompatibilitas struktur Orders lama tetap dipertahankan.
                const serverOrders = rawServerOrders.map(o => {
                    const validOrderStatuses = Object.values(ORDER_STATUS);
                    if (validOrderStatuses.includes(o.paymentStatus) && !isNaN(o.status) && o.status !== '') {
                        const vals = Object.values(o);
                        return {
                            id: o.id,
                            date: o.date,
                            clientRequestId: o.clientRequestId,
                            customerId: o.customerId,
                            customerName: o.customerName,
                            customerPhone: o.customerPhone,
                            customerEmail: o.customerEmail,
                            customerAddress: o.customerAddress,
                            bookId: o.bookId,
                            qty: o.qty,
                            unitPrice: o.unitPrice,
                            shippingCost: parseFloat(o.totalPrice) || 0,
                            subtotal: o.subtotal,
                            discountPercent: o.discountPercent,
                            discountAmount: o.discountAmount,
                            pointsUsed: o.pointsUsed,
                            pointsDiscount: o.pointsDiscount,
                            pointsEarned: o.pointsEarned,
                            totalPrice: parseFloat(o.status) || 0,
                            status: o.paymentStatus,
                            paymentStatus: o.dpAmount,
                            dpAmount: parseFloat(o.shippingVendor) || 0,
                            shippingVendor: o.trackingNumber,
                            trackingNumber: vals.length >= 15 ? vals[vals.length - 1] : ''
                        };
                    }
                    return { ...o };
                });

                const incomingServerIds = new Set(serverOrders.map(o => String(o.id || '').trim()).filter(Boolean));
                const duplicateIds = serverOrders.length !== incomingServerIds.size;
                const serverReportedCount = Number(serverData.ordersCount);
                const serverReportsComplete = serverData.ordersSnapshotComplete === true;
                const serverCountMatches = Number.isFinite(serverReportedCount) && serverReportedCount === serverOrders.length;
                const hasServerFingerprint = typeof serverData.ordersFingerprint === 'string' && serverData.ordersFingerprint.trim() !== '';
                const calculatedFingerprint = computeOrdersFingerprint(serverOrders);
                const fingerprintMatches = hasServerFingerprint && calculatedFingerprint === String(serverData.ordersFingerprint).trim();
                const serverVersionMatches = String(serverData.serverVersion || '') === SERVER_EXPECTED_VERSION;
                // Kompatibilitas dengan deployment V9: selama server menyatakan snapshot
                // lengkap dan ordersCount sama dengan jumlah data yang diterima, snapshot tetap
                // boleh menjadi authoritative. V11 menambahkan fingerprint + server version + unique ID guard
                // untuk integrity check yang lebih kuat.
                const legacyAuthoritativeSnapshot = !hasServerFingerprint && !serverData.serverVersion &&
                    !duplicateIds && serverReportsComplete && serverCountMatches;
                const v11AuthoritativeSnapshot = !duplicateIds && serverReportsComplete && serverCountMatches &&
                    fingerprintMatches && serverVersionMatches;
                const authoritativeSnapshot = legacyAuthoritativeSnapshot || v11AuthoritativeSnapshot;
                const authoritativeMode = v11AuthoritativeSnapshot ? 'V11 fingerprint + unique ID' : (legacyAuthoritativeSnapshot ? 'legacy metadata' : 'invalid');

                lastSyncMeta = {
                    engineVersion: SYNC_ENGINE_VERSION,
                    status: authoritativeSnapshot ? 'authoritative' : 'invalid',
                    authoritativeMode,
                    at: new Date().toISOString(),
                    serverGeneratedAt: serverData.serverGeneratedAt || null,
                    serverVersion: serverData.serverVersion || null,
                    serverOrdersCount: serverOrders.length,
                    reportedOrdersCount: Number.isFinite(serverReportedCount) ? serverReportedCount : null,
                    snapshotComplete: serverReportsComplete,
                    fingerprint: serverData.ordersFingerprint || null,
                    calculatedFingerprint,
                    fingerprintMatches,
                    serverVersionMatches,
                    duplicateIds
                };

                // V19: baseline LocalStorage TIDAK lagi menentukan apakah server boleh diterima.
                // Hanya snapshot yang dibuktikan lengkap oleh server + jumlah row + fingerprint
                // yang boleh menjadi sumber kebenaran. Ini menghilangkan kondisi laptop A/B
                // memiliki hasil berbeda hanya karena histori LocalStorage-nya berbeda.
                if (!authoritativeSnapshot) {
                    const reasons = [];
                    if (!serverReportsComplete) reasons.push('server belum menyatakan snapshot lengkap');
                    if (!serverCountMatches) reasons.push(`jumlah server ${Number.isFinite(serverReportedCount) ? serverReportedCount : '?'} ≠ data diterima ${serverOrders.length}`);
                    if (!fingerprintMatches) reasons.push('fingerprint snapshot tidak cocok');
                    if (!serverVersionMatches && !legacyAuthoritativeSnapshot) reasons.push(`deployment ${serverData.serverVersion || 'lama/tidak dikenal'}`);
                    if (duplicateIds) reasons.push('ID transaksi duplikat');
                    const reasonText = reasons.join('; ');
                    setBadge('warning', 'Sync ditahan • Deployment perlu dicek', `Snapshot server tidak diterima: ${reasonText}. Data aplikasi saat ini dipertahankan agar tidak hilang.`);
                    console.error('V18 SYNC DITAHAN: authoritative snapshot tidak valid.', lastSyncMeta);
                    showToast(`Sinkronisasi server ditahan: ${reasonText || 'snapshot tidak valid'}.`, 'error');
                    this.saveLocalStorage();
                    syncInProgress = false;
                    this.navigate(this.currentView);
                    return;
                }

                // === SERVER AUTHORITATIVE ===
                // V20: jangan pernah memfilter snapshot server dengan deletedOrderIds.
                // Tombstone lokal adalah artefak browser lama dan dapat menyembunyikan order
                // yang masih benar-benar ada di Google Sheets. Google Sheets selalu menang.
                // Setelah snapshot authoritative diterima, seluruh tombstone lokal dibuang.
                deletedOrderIds = new Set();
                localStorage.removeItem('ykbut_deleted_order_ids');

                const mergedOrders = [];
                const seen = new Set();

                for (const serverOrder of serverOrders) {
                    const id = String(serverOrder.id || '').trim();
                    if (!id) continue;
                    const pending = pendingOrderSync[id];
                    const local = localOrdersById.get(id);
                    const chosen = pending ? { ...pending } : { ...serverOrder };
                    if (!chosen.date && local?.date) chosen.date = local.date;
                    mergedOrders.push(chosen);
                    seen.add(id);
                }

                // Hanya transaksi yang benar-benar berada di pending queue boleh mengalahkan
                // snapshot server. LocalStorage lama yang tidak ada di server tidak pernah
                // dihidupkan kembali.
                Object.keys(pendingOrderSync || {}).forEach(id => {
                    if (seen.has(String(id))) return;
                    if (pendingOrderSync[id]) {
                        mergedOrders.push({ ...pendingOrderSync[id] });
                        seen.add(String(id));
                    }
                });

                appData.orders = mergedOrders;
                confirmedServerOrders = serverOrders.map(o => ({ ...o }));
                knownServerOrderIds = new Set(incomingServerIds);
                lastServerOrderCount = serverOrders.length;

                if (serverData.books && Array.isArray(serverData.books) && serverData.books.length > 0) mockBooks = serverData.books;
                if (serverData.settings && typeof serverData.settings === 'object') {
                    appData.settings = { ...DEFAULT_LOYALTY_SETTINGS, ...serverData.settings };
                }
                if (serverData.users && Array.isArray(serverData.users) && serverData.users.length > 0) {
                    mockUsers = serverData.users.map(u => ({
                        ...u,
                        username: u.username == null ? '' : String(u.username),
                        password: u.password == null ? '' : String(u.password)
                    }));
                    const hasAdmin = mockUsers.some(u => String(u.username || '').trim().toLowerCase() === 'admin');
                    if (!hasAdmin) mockUsers.unshift({ id: 'U001', username: 'admin', password: '12345', role: 'Administrator', name: 'Admin Utama' });
                }

                // Baseline lama sengaja di-reset menjadi baseline server terbaru.
                this.saveLocalStorage();
                appData.orders.forEach(ensureOrderHistory);
                saveOrderHistories();

                // Transaksi yang memang belum diterima server dikirim ulang. Setelah sukses,
                // transaksi tidak lagi dianggap local-only pada siklus berikutnya.
                const pendingResult = await this.syncPendingOrders();

                const pendingCount = Object.keys(pendingOrderSync || {}).length;
                const displayText = pendingResult.failed > 0
                    ? 'Tersinkron • Ada antrean sync'
                    : 'Terhubung ke Google Sheets';
                const displayTitle = `Server authoritative (${authoritativeMode}) • ${serverOrders.length} transaksi` + (serverData.ordersFingerprint ? ` • FP ${serverData.ordersFingerprint}` : '') + (pendingCount ? ` • Pending ${pendingCount}` : '');
                setBadge(pendingResult.failed > 0 ? 'warning' : 'success', displayText, displayTitle);

                // Setelah snapshot valid diterapkan, perubahan lokal lama yang tidak ada di
                // server sudah dibersihkan. Inilah titik yang memperbaiki laptop yang sebelumnya
                // membawa LocalStorage stale dari V16/V17.
                this.saveLocalStorage();
                showToast(
                    pendingResult.failed > 0
                        ? `Data server terbaru dimuat. ${pendingResult.failed} transaksi masih menunggu sinkronisasi.`
                        : `Data berhasil disinkronkan dari Google Sheets (${serverOrders.length} transaksi).`,
                    pendingResult.failed > 0 ? 'info' : 'success'
                );
                syncInProgress = false;
                this.navigate(this.currentView);
            },

            checkAuth() {
                const loginScreen = document.getElementById('login-screen');
                if(!currentUser) {
                    loginScreen.classList.remove('hidden');
                    loginScreen.classList.add('flex');
                } else {
                    loginScreen.classList.add('hidden');
                    loginScreen.classList.remove('flex');
                    
                    document.getElementById('sidebar-user-name').innerText = currentUser.name;
                    document.getElementById('sidebar-user-role').innerText = currentUser.role;

                    const navUsersBtn = document.getElementById('nav-users');
                    if (currentUser.role === 'Administrator') {
                        navUsersBtn.classList.remove('hidden');
                    } else {
                        navUsersBtn.classList.add('hidden');
                    }

                    this.applyRoleAccess();
                    this.updateDate();
                    this.navigate('dashboard');
                }
            },

            handleLogin(e) {
                e.preventDefault();
                const userVal = document.getElementById('login-username').value.trim();
                const passVal = document.getElementById('login-password').value;
                const errorMsg = document.getElementById('login-error');

                // Input password HTML selalu berupa String. Data dari Google Sheets
                // bisa berupa Number/String, sehingga keduanya dinormalisasi sebelum dibandingkan.
                // Username dibuat case-insensitive dan password tetap case-sensitive.
                const normalizedUsername = userVal.toLowerCase();
                let foundUser = mockUsers.find(u =>
                    String(u.username ?? '').trim().toLowerCase() === normalizedUsername &&
                    String(u.password ?? '') === passVal
                );

                if (foundUser) {
                    currentUser = foundUser;
                    errorMsg.classList.add('hidden');
                    document.getElementById('form-login').reset();
                    showToast(`Selamat datang, ${currentUser.name}!`, 'success');
                    this.checkAuth();
                } else {
                    errorMsg.classList.remove('hidden');
                }
            },

            logout() {
                currentUser = null;
                showToast('Anda telah keluar dari sistem.');
                this.checkAuth();
            },

            updateDate() {
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                document.getElementById('current-date').innerText = new Date().toLocaleDateString('id-ID', options);
            },

            applyRoleAccess() {
                const restricted = ['nav-add-order', 'nav-books'];
                const isViewer = currentUser && currentUser.role === 'Viewer';
                restricted.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.classList.toggle('hidden', !!isViewer);

                        titleElement.removeAttribute('title');
                        this.renderAddOrder(contentDiv);
                        break;
                    case 'books':
                        titleElement.innerText = "Manajemen Katalog Buku";
                        titleElement.className = "text-xl font-bold text-gray-800";

            updateNavStyle() {

                navs.forEach(nav => {
                    const btn = document.getElementById(`nav-${nav}`);
                    if(!btn) return;
                    if (nav === this.currentView) {

                    } else {
                        btn.className = "w-full flex items-center px-4 py-3 text-gray-300 hover:bg-gray-800 hover:text-white rounded-lg font-medium transition-colors";
                    }
                });
            },

            getDashboardOrders() {
                // Dashboard menggunakan data server yang sudah terkonfirmasi. Transaksi yang
                // benar-benar masih pending tetap ditambahkan agar transaksi baru tidak hilang
                // saat menunggu sinkronisasi. Ini mencegah localStorage lama menjadi sumber
                // angka hantu pada KPI Dashboard.
                if (!Array.isArray(confirmedServerOrders)) return Array.isArray(appData.orders) ? appData.orders : [];
                const base = confirmedServerOrders.length > 0 ? confirmedServerOrders : (Array.isArray(appData.orders) ? appData.orders : []);
                const merged = base.map(o => ({ ...o }));
                const seen = new Set(merged.map(o => String(o.id)));
                Object.keys(pendingOrderSync || {}).forEach(id => {
                    if (seen.has(String(id))) return;
                    const pending = pendingOrderSync[id];
                    if (pending) { merged.push({ ...pending }); seen.add(String(id)); }
                });
                return merged;
            },

                    const shipping = Math.max(0, Number(order?.shippingCost || 0));
                    return (qty * unitPrice) + shipping;

            openStatusTimeline(orderId, type = 'transaction') {
                const order = appData.orders.find(o => o.id === orderId);
                if (!order) return;
                ensureOrderHistory(order);
                const isTransaction = type === 'transaction';
                const stages = isTransaction
                    ? [ORDER_STATUS.NEW, ORDER_STATUS.PROCESSED, ORDER_STATUS.SHIPPING, ORDER_STATUS.COMPLETED]
                    : [PAYMENT_STATUS.UNPAID, PAYMENT_STATUS.DP, PAYMENT_STATUS.PAID];
                const history = isTransaction ? orderHistories[order.id].transaction : orderHistories[order.id].payment;
                const historyMap = Object.fromEntries(history.map(item => [item.status, item.date]));
                const currentIndex = stages.indexOf(isTransaction ? order.status : order.paymentStatus);
                const timelineClasses = isTransaction
                    ? [
                        'bg-blue-100 text-blue-600 border-blue-200',
                        'bg-yellow-100 text-yellow-600 border-yellow-200',
                        'bg-purple-100 text-purple-600 border-purple-200',
                        'bg-green-100 text-green-600 border-green-200'
                    ]
                    : [
                        'bg-red-100 text-red-600 border-red-200',
                        'bg-orange-100 text-orange-600 border-orange-200',
                        'bg-green-100 text-green-600 border-green-200'
                    ];
                const icons = isTransaction ? ['ph-receipt', 'ph-gear', 'ph-truck', 'ph-check-circle'] : ['ph-wallet', 'ph-hand-coins', 'ph-check-circle'];
                const timeline = stages.map((stage, index) => {
                    const reached = index <= currentIndex;
                    const date = historyMap[stage];
                    const reachedClass = reached ? timelineClasses[index] : 'bg-gray-100 text-gray-400 border-gray-200';
                    return `
                        <div class="relative flex items-start">
                            ${index < stages.length - 1 ? `<div class="absolute left-[15px] top-8 w-0.5 h-12 ${index < currentIndex ? 'bg-corp-primary' : 'bg-gray-200'}"></div>` : ''}
                            <div class="relative z-10 w-8 h-8 rounded-full flex items-center justify-center ${reachedClass} border-2 shrink-0">
                                <i class="ph ${icons[index]}"></i>
                            </div>
                            <div class="ml-4 pb-7">
                                <p class="font-bold text-sm ${reached ? 'text-gray-800' : 'text-gray-400'}">${stage}</p>
                                <p class="text-xs ${date ? 'text-gray-500' : 'text-gray-400 italic'} mt-0.5">${date ? formatTimelineDate(date) : 'Tanggal belum tercatat'}</p>
                                ${index === currentIndex ? '<span class="inline-block mt-1 text-[10px] font-bold text-corp-primary bg-blue-50 px-2 py-0.5 rounded-full">STATUS SAAT INI</span>' : ''}
                            </div>
                        </div>`;
                }).join('');

                document.getElementById('modal-root').innerHTML = `
                    <div id="timeline-modal-backdrop" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center fade-in p-4">

                                </div>
                                <button onclick="app.closeModal()" class="text-gray-500 hover:text-red-500 transition"><i class="ph ph-x text-xl"></i></button>
                            </div>
                            <div class="p-6">

                                </div>
                                ${timeline}
                            </div>
                            <div class="p-4 bg-gray-50 border-t border-gray-200 flex justify-end">
                                <button onclick="app.closeModal()" class="px-4 py-2 bg-corp-primary text-white font-semibold rounded-lg hover:bg-blue-800 transition shadow">Tutup</button>
                            </div>
                        </div>
                    </div>`;
            },

            getFilteredOrders() {
                const f = orderFilters || {};
                const q = String(orderSearchQuery || '').trim().toLowerCase();
                return (appData.orders || []).filter(order => {
                    const book = getBook(order.bookId);
                    const bookTitle = book ? String(book.title).toLowerCase() : '';
                    const searchable = [order.id, order.customerId, order.customerName, order.customerPhone, order.customerEmail, bookTitle]
                        .map(v => String(v || '').toLowerCase());
                    const matchesSearch = !q || searchable.some(v => v.includes(q));
                    const date = String(order.date || '').slice(0,10);
                    const matchesFrom = !f.dateFrom || (date && date >= f.dateFrom);
                    const matchesTo = !f.dateTo || (date && date <= f.dateTo);
                    const matchesStatus = !f.status || String(order.status || '') === String(f.status);
                    const matchesPayment = !f.paymentStatus || String(order.paymentStatus || '') === String(f.paymentStatus);
                    const matchesBook = !f.bookId || String(order.bookId || '') === String(f.bookId);
                    return matchesSearch && matchesFrom && matchesTo && matchesStatus && matchesPayment && matchesBook;
                });
            },

            handleOrderSearch(val) {
                orderSearchQuery = val;
                this.renderOrders(document.getElementById('app-content'));
            },

            handleOrderFilter(key, value) {
                if (!(key in orderFilters)) return;
                orderFilters[key] = value || '';
                this.renderOrders(document.getElementById('app-content'));
            },

            resetOrderFilters() {
                orderSearchQuery = '';
                orderFilters = { dateFrom: '', dateTo: '', status: '', paymentStatus: '', bookId: '' };
                this.renderOrders(document.getElementById('app-content'));
            },

            makeImportRequestId(index = 0) {
                const seed = `${Date.now()}-${index}-${Math.random().toString(36).slice(2,10)}`;
                return `IMPORT-${seed}`;
            },

            normalizeImportHeader(value) {
                return String(value ?? '')
                    .trim()
                    .toLowerCase()
                    .replace(/[\s_\-\/().]+/g, '');
            },

            getImportValue(row, aliases) {
                const keys = Object.keys(row || {});
                const normalized = new Map(keys.map(k => [this.normalizeImportHeader(k), k]));
                for (const alias of aliases) {
                    const key = normalized.get(this.normalizeImportHeader(alias));
                    if (key !== undefined) return row[key];
                }
                return undefined;
            },

            parseImportedDate(value) {
                if (value === undefined || value === null || value === '') return '';
                if (value instanceof Date && !Number.isNaN(value.getTime())) {
                    const d = new Date(value.getTime() - value.getTimezoneOffset() * 60000);
                    return d.toISOString().slice(0,10);
                }
                if (typeof value === 'number' && window.XLSX && XLSX.SSF && XLSX.SSF.parse_date_code) {
                    const parsed = XLSX.SSF.parse_date_code(value);
                    if (parsed && parsed.y && parsed.m && parsed.d) return `${parsed.y}-${String(parsed.m).padStart(2,'0')}-${String(parsed.d).padStart(2,'0')}`;
                }
                const raw = String(value).trim();
                if (/^\d{4}-\d{1,2}-\d{1,2}/.test(raw)) {
                    const m = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
                    return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
                }
                const dmY = raw.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
                if (dmY) return `${dmY[3]}-${String(dmY[2]).padStart(2,'0')}-${String(dmY[1]).padStart(2,'0')}`;
                const parsedDate = new Date(raw);
                if (!Number.isNaN(parsedDate.getTime())) {
                    const d = new Date(parsedDate.getTime() - parsedDate.getTimezoneOffset() * 60000);
                    return d.toISOString().slice(0,10);
                }
                return '';
            },

            normalizeImportOrder(row, index) {
                const get = (aliases) => this.getImportValue(row, aliases);
                const rawId = get(['ID Transaksi','ID','id','Transaction ID']);
                const rawBookId = get(['Book ID','bookId','ID Buku']);
                const rawBookTitle = get(['Buku','Judul Buku','Book','Book Title']);
                const bookId = String(rawBookId ?? '').trim() || (() => {
                    const title = String(rawBookTitle ?? '').trim().toLowerCase();
                    if (!title) return '';
                    const found = mockBooks.find(b => String(b.title || '').trim().toLowerCase() === title);
                    return found ? found.id : '';
                })();
                const qty = Number(get(['Qty','Quantity','Jumlah'])) || 0;
                const unitPrice = Number(get(['Harga Satuan','Unit Price','unitPrice','Harga'])) || 0;
                const shippingCost = Number(get(['Ongkir','Ongkos Kirim','Shipping Cost','shippingCost'])) || 0;
                const subtotalRaw = get(['Subtotal','Sub Total']);
                const discountPercent = Number(get(['Diskon %','Discount Percent','discountPercent'])) || 0;
                const discountAmount = Number(get(['Diskon','Discount','discountAmount'])) || 0;
                const pointsUsed = Number(get(['Poin','Points Used','pointsUsed'])) || 0;
                const pointsDiscount = Number(get(['Potongan Poin','Points Discount','pointsDiscount'])) || 0;
                const totalRaw = get(['Total Bayar','Total Harga','Total','totalPrice']);
                const subtotal = subtotalRaw === undefined || subtotalRaw === '' ? ((qty * unitPrice) + shippingCost) : Number(subtotalRaw) || 0;
                const calculatedTotal = Math.max(0, subtotal - discountAmount - pointsDiscount);
                const totalPrice = totalRaw === undefined || totalRaw === '' ? calculatedTotal : Number(totalRaw) || 0;
                const status = String(get(['Status Transaksi','Status','status']) ?? '').trim();
                const paymentStatus = String(get(['Status Pembayaran','Pembayaran','paymentStatus']) ?? '').trim();
                const customerId = String(get(['Customer ID','customerId','ID Customer']) ?? '').trim().toUpperCase();
                const customerName = String(get(['Customer','Nama Customer','Nama Pemesan','customerName']) ?? '').trim();
                const customerPhone = String(get(['No HP','Nomor HP','Telepon','Phone','customerPhone']) ?? '').trim();
                const customerEmail = String(get(['Email','customerEmail']) ?? '').trim();
                const customerAddress = String(get(['Alamat','Address','customerAddress']) ?? '').trim();
                const dpAmount = Number(get(['DP Amount','DP','dpAmount'])) || 0;
                const shippingVendor = String(get(['Vendor Ekspedisi','Ekspedisi','shippingVendor']) ?? '').trim();
                const trackingNumber = String(get(['Nomor Resi','Resi','trackingNumber']) ?? '').trim();
                const date = this.parseImportedDate(get(['Tanggal','Tanggal Pemesanan','Date','date']));

                let id = String(rawId ?? '').trim().toUpperCase();
                const isPendingId = id.startsWith('ORD-PENDING-');
                const isNewOrder = !id || isPendingId;
                if (isNewOrder) id = `ORD-PENDING-IMPORT-${Date.now()}-${index}-${Math.random().toString(36).slice(2,8)}`;

                if (!bookId) return { valid:false, reason:'Buku tidak ditemukan. Gunakan Book ID atau Judul Buku yang sama dengan Katalog Buku.', row };
                if (!qty || qty < 0) return { valid:false, reason:'Qty tidak valid.', row };
                if (!customerName) return { valid:false, reason:'Nama customer kosong.', row };

                const existing = appData.orders.find(o => String(o.id).toUpperCase() === String(rawId ?? '').trim().toUpperCase());
                const patch = {
                    id,
                    date: date || (existing?.date || todayISO()),
                    customerId: customerId || existing?.customerId || '',
                    customerName,
                    customerPhone,
                    customerEmail,
                    customerAddress,
                    bookId,
                    qty,
                    unitPrice,
                    shippingCost,
                    subtotal,
                    discountPercent,
                    discountAmount,
                    pointsUsed,
                    pointsDiscount,
                    pointsEarned: Number(get(['Poin Diperoleh','Points Earned','pointsEarned'])) || existing?.pointsEarned || 0,
                    totalPrice,
                    status: status || existing?.status || ORDER_STATUS.NEW,
                    paymentStatus: paymentStatus || existing?.paymentStatus || PAYMENT_STATUS.UNPAID,
                    dpAmount,
                    shippingVendor,
                    trackingNumber,
                    clientRequestId: String(get(['clientRequestId','Client Request ID']) ?? existing?.clientRequestId ?? this.makeImportRequestId(index)),
                    isNewOrder,
                    isNewCustomer: !customerId && !existing?.customerId
                };

                return { valid:true, order:patch, isExisting:!!existing && !isNewOrder, row };
            },

            openImportExcel() {
                if (currentUser && currentUser.role === 'Viewer') {
                    showToast('Viewer tidak memiliki hak untuk import data.', 'error');
                    return;
                }
                if (!window.XLSX) {
                    showToast('Library Excel belum siap. Periksa koneksi internet lalu coba lagi.', 'error');
                    return;
                }
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.xlsx,.xls,.csv';
                input.style.display = 'none';
                input.onchange = async (e) => {
                    const file = e.target.files && e.target.files[0];
                    input.remove();
                    if (file) await this.handleImportExcelFile(file);
                };
                document.body.appendChild(input);
                input.click();
            },

            async handleImportExcelFile(file) {
                try {
                    const buffer = await file.arrayBuffer();
                    const workbook = XLSX.read(buffer, { type:'array', cellDates:true, raw:true });
                    const sheetName = workbook.SheetNames[0];
                    if (!sheetName) throw new Error('Sheet Excel tidak ditemukan.');
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval:'', raw:true });
                    if (!rows.length) throw new Error('File Excel tidak memiliki data.');

                    const parsed = rows.map((row, idx) => this.normalizeImportOrder(row, idx));
                    const valid = parsed.filter(x => x.valid);
                    const invalid = parsed.filter(x => !x.valid);
                    const updates = valid.filter(x => x.isExisting);
                    const additions = valid.filter(x => !x.isExisting);
                    this._pendingImportOrders = valid.map(x => x.order);

                    document.getElementById('modal-root').innerHTML = `

            async confirmImportExcel() {
                const orders = Array.isArray(this._pendingImportOrders) ? this._pendingImportOrders.slice() : [];
                if (!orders.length) return;
                const btns = document.querySelectorAll('#modal-root button');
                btns.forEach(b => b.disabled = true);
                showToast(`Mengimport ${orders.length} data tanpa menghapus data lama...`, 'info');
                try {
                    const res = await apiService.sendAction('importOrders', { orders });
                    if (!res || res.status !== 'success') throw new Error(res?.message || 'Server menolak import.');

                    const returned = Array.isArray(res.orders) ? res.orders : [];
                    const returnedById = new Map(returned.map(o => [String(o.id), o]));
                    orders.forEach(localOrder => {
                        const final = returnedById.get(String(localOrder.id)) || localOrder;
                        const idx = appData.orders.findIndex(o => String(o.id) === String(localOrder.id));
                        if (idx >= 0) appData.orders[idx] = { ...appData.orders[idx], ...final, isNewOrder:false, isNewCustomer:false };
                        else appData.orders.unshift({ ...final, isNewOrder:false, isNewCustomer:false });
                        delete pendingOrderSync[String(localOrder.id)];
                        ensureOrderHistory(final);
                    });
                    saveOrderHistories();
                    this.saveLocalStorage();
                    this._pendingImportOrders = [];
                    this.closeModal();
                    showToast(`Import selesai: ${res.updated || 0} diperbarui, ${res.added || 0} data baru, ${res.skipped || 0} dilewati. Data lama di luar file tetap aman.`, 'success');
                    await this.syncFromSpreadsheet();
                } catch (error) {
                    console.error('Konfirmasi import gagal:', error);
                    showToast('Import gagal: ' + (error.message || 'Terjadi kesalahan.'), 'error');
                    btns.forEach(b => b.disabled = false);
                }

            exportToExcel() {
                const orders = this.getFilteredOrders();
                if (!orders.length) {
                    showToast('Tidak ada data pemesanan yang sesuai dengan filter.', 'error');
                    return;
                }

                const esc = (v) => escapeHtml(v == null ? '' : v);
                const totalRevenue = orders.reduce((sum, o) => sum + Number(o.totalPrice || 0), 0);
                const totalShipping = orders.reduce((sum, o) => sum + Number(o.shippingCost || 0), 0);
                const totalQty = orders.reduce((sum, o) => sum + Number(o.qty || 0), 0);
                const filterText = [
                    orderFilters.dateFrom ? `Dari ${formatDateID(orderFilters.dateFrom)}` : '',
                    orderFilters.dateTo ? `Sampai ${formatDateID(orderFilters.dateTo)}` : '',
                    orderFilters.status ? `Status: ${orderFilters.status}` : '',
                    orderFilters.paymentStatus ? `Pembayaran: ${orderFilters.paymentStatus}` : '',
                    orderFilters.bookId ? `Buku: ${(getBook(orderFilters.bookId) || {}).title || orderFilters.bookId}` : '',
                    orderSearchQuery ? `Pencarian: ${orderSearchQuery}` : ''
                ].filter(Boolean).join(' | ') || 'Semua Data';

                let tableHtml = `<table border="1" style="border-collapse:collapse;"><tr><th colspan="18">LAPORAN DATA PEMESANAN YKBUT PRESS</th></tr><tr><td colspan="18">Filter: ${esc(filterText)}</td></tr><tr><td colspan="18">Jumlah Pesanan: ${orders.length} | Total Qty: ${totalQty} | Total Ongkir: ${totalShipping} | Total Nilai Transaksi: ${totalRevenue}</td></tr><tr><th>ID Transaksi</th><th>Tanggal</th><th>Customer ID</th><th>Nama Pemesan</th><th>No HP</th><th>Email</th><th>Alamat</th><th>Judul Buku</th><th>Qty</th><th>Harga Satuan</th><th>Ongkos Kirim</th><th>Subtotal</th><th>Diskon</th><th>Potongan Poin</th><th>Total Bayar</th><th>Status Transaksi</th><th>Status Pembayaran</th><th>Resi</th></tr>`;

                orders.forEach(order => {
                    const book = getBook(order.bookId);
                    tableHtml += `<tr><td>${esc(getOrderDisplayId(order))}</td><td>${esc(order.date)}</td><td>${esc(order.customerId || '')}</td><td>${esc(order.customerName)}</td><td>${esc(order.customerPhone)}</td><td>${esc(order.customerEmail || '-')}</td><td>${esc(order.customerAddress)}</td><td>${esc(book ? book.title : '-')}</td><td>${Number(order.qty || 0)}</td><td>${Number(order.unitPrice || 0)}</td><td>${Number(order.shippingCost || 0)}</td><td>${Number(order.subtotal || ((Number(order.qty || 0) * Number(order.unitPrice || 0)) + Number(order.shippingCost || 0)))}</td><td>${Number(order.discountAmount || 0)}</td><td>${Number(order.pointsDiscount || 0)}</td><td>${Number(order.totalPrice || 0)}</td><td>${esc(order.status)}</td><td>${esc(order.paymentStatus)}</td><td>${esc(order.trackingNumber || '-')}</td></tr>`;
                });
                tableHtml += `</table>`;

                const uri = 'data:application/vnd.ms-excel;base64,';
                const template = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"><style>th,td{padding:6px;border:1px solid #999;} th{font-weight:bold;}</style></head><body>{table}</body></html>';
                const base64 = function(s) { return window.btoa(unescape(encodeURIComponent(s))) };
                const format = function(s, c) { return s.replace(/{(\w+)}/g, function(m, p) { return c[p]; }) };
                const ctx = { worksheet: 'Laporan Pemesanan', table: tableHtml };
                const link = document.createElement('a');
                link.download = `Laporan_Pemesanan_YKBUT_${new Date().toISOString().slice(0,10)}.xls`;
                link.href = uri + base64(format(template, ctx));
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast(`Laporan berhasil diexport (${orders.length} pesanan).`, 'success');
            },

            downloadAllReportPDF() {
                try {
                    if (!window.jspdf || !window.jspdf.jsPDF) {
                        showToast('Library PDF belum siap. Periksa koneksi internet lalu coba lagi.', 'error');
                        return;
                    }
                    const orders = Array.isArray(appData.orders) ? appData.orders.slice() : [];
                    if (!orders.length) {
                        showToast('Tidak ada data pemesanan untuk dibuatkan laporan PDF.', 'error');
                        return;
                    }

                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                    const margin = 12;
                    const pageWidth = doc.internal.pageSize.getWidth();
                    const pageHeight = doc.internal.pageSize.getHeight();
                    const generatedAt = new Date();
                    const fmtNum = (v) => Number(v || 0).toLocaleString('id-ID');
                    const fmtRp = (v) => formatRupiah(Number(v || 0));
                    const fmtDate = (v) => v ? formatDateID(v) : '-';
                    const safeText = (v) => String(v ?? '-').replace(/[\r\n]+/g, ' ');

                    // KPI mengikuti definisi yang digunakan dashboard.
                    const totalOrders = orders.length;
                    const totalBooksSold = orders.reduce((sum, o) => sum + Number(o.qty || 0), 0);
                    const totalRevenue = orders.reduce((sum, o) => sum + Number(o.totalPrice || 0), 0);
                    const totalShipping = orders.reduce((sum, o) => sum + Number(o.shippingCost || 0), 0);
                    const totalCost = orders.reduce((sum, o) => {
                        const book = getBook(o.bookId);
                        const bookCost = book ? Number(book.costPrice || 0) : 0;
                        return sum + (bookCost * Number(o.qty || 0)) + Number(o.shippingCost || 0);
                    }, 0);
                    const totalProfit = totalRevenue - totalCost;

                    const statuses = [ORDER_STATUS.NEW, ORDER_STATUS.PROCESSED, ORDER_STATUS.SHIPPING, ORDER_STATUS.COMPLETED];
                    const statusRows = statuses.map(status => {
                        const rows = orders.filter(o => o.status === status);
                        return [status, rows.length, fmtRp(rows.reduce((sum, o) => sum + Number(o.totalPrice || 0), 0))];
                    });

                    // Sama dengan dashboard: 12 bulan terakhir termasuk bulan berjalan.
                    const monthlyRows = [];
                    const now = new Date();
                    for (let i = 11; i >= 0; i--) {
                        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                        const year = d.getFullYear();
                        const month = d.getMonth();
                        const label = d.toLocaleDateString('id-ID', { month: 'short', year: 'numeric' });
                        const value = orders.reduce((sum, o) => {
                            if (!o.date) return sum;
                            const od = new Date(`${o.date}T00:00:00`);
                            return (od.getFullYear() === year && od.getMonth() === month) ? sum + Number(o.totalPrice || 0) : sum;
                        }, 0);
                        monthlyRows.push([label, fmtRp(value)]);
                    }

                    // Header laporan.
                    doc.setFillColor(15, 23, 42);
                    doc.rect(0, 0, pageWidth, 28, 'F');
                    doc.setTextColor(255, 255, 255);
                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(16);
                    doc.text('YKBUT PRESS', margin, 11);
                    doc.setFontSize(10);
                    doc.setFont('helvetica', 'normal');
                    doc.text('Laporan Data Pemesanan & Ringkasan Dashboard', margin, 17);
                    doc.setFontSize(8);
                    doc.text(`Dibuat: ${generatedAt.toLocaleString('id-ID')}`, pageWidth - margin, 17, { align: 'right' });
                    doc.text('Seluruh Data Pemesanan', pageWidth - margin, 22, { align: 'right' });

                    let y = 36;
                    doc.setTextColor(31, 41, 55);
                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(11);
                    doc.text('A. Ringkasan Dashboard', margin, y);
                    y += 5;

                    const kpis = [
                        ['Total Transaksi', fmtNum(totalOrders)],
                        ['Total Omset Penjualan', fmtRp(totalRevenue)],
                        ['Total Biaya', fmtRp(totalCost)],
                        ['Total Profit', fmtRp(totalProfit)],
                        ['Buku Terjual', `${fmtNum(totalBooksSold)} Eks`],
                        ['Total Ongkos Kirim', fmtRp(totalShipping)]
                    ];
                    doc.autoTable({
                        startY: y,
                        head: [['Indikator', 'Nilai']],
                        body: kpis,
                        theme: 'grid',
                        margin: { left: margin, right: margin },
                        styles: { fontSize: 8.5, cellPadding: 2.4, textColor: [55, 65, 81] },
                        headStyles: { fillColor: [29, 78, 216], textColor: 255, fontStyle: 'bold' },
                        columnStyles: { 0: { cellWidth: 65 }, 1: { cellWidth: 115, halign: 'right' } }
                    });
                    y = doc.lastAutoTable.finalY + 8;

                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(11);
                    doc.text('B. Nilai Transaksi per Status', margin, y);
                    y += 4;
                    doc.autoTable({
                        startY: y,
                        head: [['Status Transaksi', 'Jumlah Pesanan', 'Nilai Transaksi']],
                        body: statusRows,
                        theme: 'grid',
                        margin: { left: margin, right: margin },
                        styles: { fontSize: 8.5, cellPadding: 2.4 },
                        headStyles: { fillColor: [29, 78, 216], textColor: 255, fontStyle: 'bold' },
                        columnStyles: { 1: { halign: 'center', cellWidth: 35 }, 2: { halign: 'right', cellWidth: 50 } }
                    });
                    y = doc.lastAutoTable.finalY + 8;

                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(11);
                    doc.text('C. Tren Nilai Transaksi 12 Bulan Terakhir', margin, y);
                    y += 4;
                    doc.autoTable({
                        startY: y,
                        head: [['Bulan', 'Nilai Transaksi']],
                        body: monthlyRows,
                        theme: 'grid',
                        margin: { left: margin, right: margin },
                        styles: { fontSize: 8.5, cellPadding: 2.2 },
                        headStyles: { fillColor: [29, 78, 216], textColor: 255, fontStyle: 'bold' },
                        columnStyles: { 0: { cellWidth: 65 }, 1: { cellWidth: 115, halign: 'right' } }
                    });

                    // Detail seluruh transaksi.
                    doc.addPage();
                    y = 16;
                    doc.setTextColor(31, 41, 55);
                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(12);
                    doc.text('D. Detail Seluruh Data Pemesanan', margin, y);
                    y += 5;
                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(8);
                    doc.text(`Total ${fmtNum(totalOrders)} transaksi | Total nilai transaksi ${fmtRp(totalRevenue)}`, margin, y);
                    y += 3;

                    const detailBody = orders.slice().sort((a,b) => String(a.date || '').localeCompare(String(b.date || ''))).map(o => {
                        const book = getBook(o.bookId);
                        return [
                            safeText(o.id),
                            fmtDate(o.date),
                            safeText(o.customerId || ''),
                            safeText(o.customerName),
                            safeText(book ? book.title : '-'),
                            fmtNum(o.qty),
                            fmtRp(o.shippingCost),
                            fmtRp(o.discountAmount),
                            fmtRp(o.pointsDiscount),
                            fmtRp(o.totalPrice),
                            safeText(o.status),
                            safeText(o.paymentStatus)
                        ];
                    });

                    doc.autoTable({
                        startY: y + 2,
                        head: [['ID', 'Tanggal', 'Customer ID', 'Customer', 'Buku', 'Qty', 'Ongkir', 'Diskon', 'Poin', 'Total Bayar', 'Status', 'Pembayaran']],
                        body: detailBody,
                        theme: 'grid',
                        // A4 portrait: area efektif 196 mm (210 - 7 - 7).
                        // Lebar kolom dijaga total tepat 196 mm agar tabel tidak terpotong di sisi kanan.
                        margin: { top: 12, right: 7, bottom: 12, left: 7 },
                        tableWidth: 196,
                        styles: { fontSize: 5.1, cellPadding: 1.1, overflow: 'linebreak', valign: 'middle', lineColor: [203, 213, 225], lineWidth: 0.1 },
                        headStyles: { fillColor: [15, 23, 42], textColor: 255, fontStyle: 'bold', fontSize: 5.1, cellPadding: 1.1, overflow: 'linebreak' },
                        columnStyles: {
                            0: { cellWidth: 14 }, 1: { cellWidth: 15 }, 2: { cellWidth: 18 }, 3: { cellWidth: 23 },
                            4: { cellWidth: 27 }, 5: { cellWidth: 8, halign: 'center' }, 6: { cellWidth: 14, halign: 'right' },
                            7: { cellWidth: 14, halign: 'right' }, 8: { cellWidth: 14, halign: 'right' }, 9: { cellWidth: 20, halign: 'right' },
                            10: { cellWidth: 14 }, 11: { cellWidth: 15 }
                        },
                        didDrawPage: (data) => {
                            doc.setFontSize(7);
                            doc.setTextColor(100, 116, 139);
                            doc.text(`YKBUT Press | Halaman ${doc.internal.getNumberOfPages()}`, pageWidth - 7, pageHeight - 5, { align: 'right' });
                        }
                    });

                    // Footer dan metadata pada semua halaman.
                    const totalPages = doc.internal.getNumberOfPages();
                    for (let page = 1; page <= totalPages; page++) {
                        doc.setPage(page);
                        doc.setFont('helvetica', 'normal');
                        doc.setFontSize(7);
                        doc.setTextColor(100, 116, 139);
                        doc.text('Dokumen dibuat otomatis oleh YKBUT Press Order Management System', margin, pageHeight - 5);
                    }

                    const filename = `Laporan_All_YKBUT_Press_${generatedAt.toISOString().slice(0,10)}.pdf`;
                    doc.save(filename);
                    showToast(`PDF laporan berhasil dibuat (${totalOrders} transaksi).`, 'success');
                } catch (error) {
                    console.error('PDF report error:', error);
                    showToast('Gagal membuat PDF: ' + (error?.message || 'terjadi kesalahan.'), 'error');
                }

                // V20: tidak lagi membuat tombstone permanen di LocalStorage. Setelah server
                // berhasil menghapus, order tidak akan kembali karena snapshot server menjadi
                // authoritative. Jika server gagal, sync ulang akan mengembalikan data server.
