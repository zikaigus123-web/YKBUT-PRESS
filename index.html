            previewShippingCost() {
                const orderId = this._activeShippingOrderId;
                if (!orderId) return;
                const order = appData.orders.find(o => String(o.id) === String(orderId));
                if (!order) return;
                const input = document.getElementById('modal-shipping-cost');
                const newShipping = Math.max(0, Number(input?.value || 0));
                const calc = calculateOrderWithShipping(order, newShipping);
                const previewShipping = document.getElementById('preview-shipping-cost');
                const previewDiscount = document.getElementById('preview-discount');
                const previewPoints = document.getElementById('preview-points-discount');
                const previewTotal = document.getElementById('preview-total-price');
                if (previewShipping) previewShipping.innerText = formatRupiah(calc.shippingCost);
                if (previewDiscount) previewDiscount.innerText = formatRupiah(calc.discountAmount);
                if (previewPoints) previewPoints.innerText = formatRupiah(calc.pointsDiscount);
                if (previewTotal) previewTotal.innerText = formatRupiah(calc.totalPrice);
            },

            async saveShippingCost(orderId) {
                if (currentUser && currentUser.role === 'Viewer') return;
                const order = appData.orders.find(o => String(o.id) === String(orderId));
                const input = document.getElementById('modal-shipping-cost');
                if (!order || !input) return;
                const newShipping = Math.max(0, Number(input.value || 0));
                const calc = calculateOrderWithShipping(order, newShipping);
                if (newShipping === Number(order.shippingCost || 0)) {
                    showToast('Nilai ongkir tidak berubah.', 'info');
                    this.closeModal();
                    return;
                }

                order.shippingCost = calc.shippingCost;
                order.subtotal = calc.subtotal;
                order.discountPercent = calc.discountPercent;
                order.discountAmount = calc.discountAmount;
                order.pointsUsed = calc.pointsUsed;
                order.pointsDiscount = calc.pointsDiscount;
                order.pointsEarned = calc.pointsEarned;
                order.totalPrice = calc.totalPrice;
                if (order.paymentStatus === PAYMENT_STATUS.PAID) order.dpAmount = calc.totalPrice;
                else if (order.paymentStatus === PAYMENT_STATUS.DP) order.dpAmount = Math.min(Number(order.dpAmount || 0), calc.totalPrice);
                order.isNewOrder = false;
                order.isNewCustomer = false;
                this.queueOrderForSync(order);
                this.closeModal();
                this.renderOrders(document.getElementById('app-content'));
                showToast('Mengirim perubahan ongkir ke Google Sheets...', 'info');

                let res = await apiService.sendAction('updateShippingCost', {
                    id: order.id,
                    shippingCost: calc.shippingCost,
                    qty: order.qty,
                    unitPrice: order.unitPrice,
                    discountPercent: order.discountPercent,
                    pointsUsed: order.pointsUsed,
                    paymentStatus: order.paymentStatus,
                    dpAmount: order.dpAmount
                });
                if ((!res || res.status !== 'success') && /Action tidak dikenal/i.test(String(res?.message || ''))) {
                    res = await apiService.sendAction('saveOrder', order);
                }

                if (res && res.status === 'success') {
                    const saved = res.order || {};
                    Object.keys(saved).forEach(k => { if (saved[k] !== undefined) order[k] = saved[k]; });
                    delete pendingOrderSync[String(order.id)];
                    if (Array.isArray(confirmedServerOrders)) {
                        const idx = confirmedServerOrders.findIndex(o => String(o.id) === String(order.id));
                        if (idx >= 0) confirmedServerOrders[idx] = { ...order }; else confirmedServerOrders.push({ ...order });
                    }
                    this.saveLocalStorage();
                    this.renderOrders(document.getElementById('app-content'));
                    showToast(`Ongkir ${formatRupiah(order.shippingCost)} berhasil disimpan. Total harga menjadi ${formatRupiah(order.totalPrice)}.`, 'success');
                } else {
                    showToast('Gagal menyimpan ongkir ke Google Sheets: ' + (res?.message || 'deployment belum siap'), 'error');
                    await this.syncFromSpreadsheet();
                }
            },

            async saveOrderEdit(orderId) {
                if (currentUser && currentUser.role === 'Viewer') return;
                const order = appData.orders.find(o => o.id === orderId);
                if(!order) return;

                const newPayStatus = document.getElementById('modal-pay-status').value;
                const newOrderStatus = document.getElementById('modal-order-status').value;
                const vendor = document.getElementById('modal-vendor').value;
                const resi = document.getElementById('modal-resi').value;
                const newOrderDate = document.getElementById('modal-order-date')?.value || order.date || todayISO();

                ensureOrderHistory(order);
                order.date = newOrderDate;
                // Jika histori awal masih memakai tanggal lama/kosong, sinkronkan dengan tanggal pemesanan.
                if (orderHistories[order.id]?.transaction?.length === 1) {
                    orderHistories[order.id].transaction[0].date = newOrderDate;
                }
                if (orderHistories[order.id]?.payment?.length >= 1 && orderHistories[order.id].payment[0].status === PAYMENT_STATUS.UNPAID) {
                    orderHistories[order.id].payment[0].date = newOrderDate;
                }
                const changeDate = todayISO();
                if (order.paymentStatus !== newPayStatus) {
                    orderHistories[order.id].payment.push({ status: newPayStatus, date: changeDate });
                }
                if (order.status !== newOrderStatus) {
                    orderHistories[order.id].transaction.push({ status: newOrderStatus, date: changeDate });
                }
                order.paymentStatus = newPayStatus;
                order.status = newOrderStatus;
                saveOrderHistories();
                
                if (newOrderStatus === ORDER_STATUS.SHIPPING || newOrderStatus === ORDER_STATUS.COMPLETED) {
                    order.shippingVendor = vendor;
                    order.trackingNumber = resi;
                }

                if (newPayStatus === PAYMENT_STATUS.PAID) {
                    order.dpAmount = order.totalPrice;
                }

                // Order yang diedit tidak lagi dianggap customer baru. Ini mencegah server
                // membuat Customer ID baru setiap kali status/tanggal diedit.
                order.isNewCustomer = false;
                this.queueOrderForSync(order);
                this.closeModal();
                this.renderOrders(document.getElementById('app-content'));

                showToast('Mengirim update ke Google Sheets...', 'info');
                const res = await apiService.sendAction('saveOrder', order);
                if(res && res.status === 'success') {
                    delete pendingOrderSync[String(order.id)];
                    this.saveLocalStorage();
                    const verify = await verifyOrderDateOnServer(order.id, order.date);
                    if (verify.ok) {
                        showToast('Perubahan & tanggal pemesanan berhasil tersimpan di Google Sheets!', 'success');
                    } else {
                        const diag = await apiService.diagnose();
                        console.error('Verifikasi tanggal gagal:', { verify, diag });
                        if (diag?.status === 'success' && !diag.hasDateColumn) showToast('Kolom date belum tersedia pada deployment aktif.', 'error');
                        else if (diag?.status === 'success' && diag.spreadsheetId !== SPREADSHEET_CONFIG.TARGET_SHEET_ID) showToast('Web App terhubung ke Spreadsheet yang berbeda.', 'error');
                        else showToast('Tanggal belum terbaca kembali dari Google Sheets. Periksa deployment Web App.', 'error');
                    }
                } else {
                    showToast('Google Sheets menolak penyimpanan: ' + (res?.message || 'deployment belum siap'), 'error');
                }
            },

                const selectBook = document.getElementById('book-select');
                const inputPrice = document.getElementById('book-price');
                const inputQty = document.getElementById('book-qty');
                const inputShipping = document.getElementById('book-shipping');
                const labelTotal = document.getElementById('label-total-price');
                const selectPay = document.getElementById('pay-status');
                const containerDp = document.getElementById('dp-input-container');
                const inputDp = document.getElementById('pay-dp');

                const customerSelect = document.getElementById('customer-history-select');
                const customerIdInput = document.getElementById('cust-id');
                const discountInput = document.getElementById('pay-discount-percent');
                const pointsInput = document.getElementById('pay-points-used');
                const pointsInfo = document.getElementById('available-points-info');
                const customerPointsInfo = document.getElementById('customer-points-info');
                const calculateTotal = () => {
                    const price = parseFloat(inputPrice.value) || 0;
                    const qty = parseInt(inputQty.value) || 0;
                    const shipping = parseFloat(inputShipping.value) || 0;
                    const subtotal = (price * qty) + shipping;
                    const maxDiscount = Number(appData.settings?.maxDiscountPercent || 0);
                    let discountPercent = Math.max(0, Number(discountInput?.value || 0));
                    if (discountPercent > maxDiscount) { discountPercent = maxDiscount; if (discountInput) discountInput.value = discountPercent; }
                    const discountAmount = Math.min(subtotal, subtotal * discountPercent / 100);
                    const customer = getCustomerById(customerIdInput?.value);
                    const availablePoints = customer ? Number(customer.points || 0) : 0;
                    let pointsUsed = Math.max(0, parseInt(pointsInput?.value || 0) || 0);
                    pointsUsed = Math.min(pointsUsed, availablePoints);
                    const pointValue = Number(appData.settings?.pointValue || 0);
                    const pointsDiscount = Math.min(Math.max(0, subtotal - discountAmount), pointsUsed * pointValue);
                    const total = Math.max(0, subtotal - discountAmount - pointsDiscount);
                    const pointsEarned = Math.floor(total / Math.max(1, Number(appData.settings?.rupiahPerPoint || 10000)));
                    labelTotal.innerText = formatRupiah(total);
                    document.getElementById('label-subtotal').innerText = formatRupiah(subtotal);
                    document.getElementById('label-discount').innerText = formatRupiah(discountAmount);
                    document.getElementById('label-points-discount').innerText = formatRupiah(pointsDiscount);
                    document.getElementById('label-payment-total').innerText = formatRupiah(total);
                    document.getElementById('label-points-earned').innerText = pointsEarned.toLocaleString('id-ID');
                    if (pointsInfo) pointsInfo.innerText = `Saldo poin: ${availablePoints.toLocaleString('id-ID')} • 1 poin = ${formatRupiah(pointValue)}`;
                    return { subtotal, discountPercent, discountAmount, pointsUsed, pointsDiscount, total, pointsEarned, availablePoints };
                };

                const applyCustomer = (id) => {
                    const customer = getCustomerById(id);
                    if (!customer) {
                        if (customerPointsInfo) customerPointsInfo.innerText = 'Customer baru. ID akan digunakan untuk histori transaksi berikutnya.';
                        calculateTotal();
                        return;
                    }
                    customerIdInput.value = customer.id;
                    document.getElementById('cust-name').value = customer.name || '';
                    document.getElementById('cust-phone').value = customer.phone || '';
                    document.getElementById('cust-email').value = customer.email || '';
                    document.getElementById('cust-address').value = customer.address || '';
                    if (customerPointsInfo) customerPointsInfo.innerText = `${customer.id} • ${customer.transactions} transaksi • saldo ${customer.points.toLocaleString('id-ID')} poin • total belanja ${formatRupiah(customer.totalSpent)}`;
                    calculateTotal();
                };

                // Customer ID untuk customer baru selalu dibuat otomatis dan readonly.
                // Untuk customer lama, ID mengikuti histori customer yang dipilih.
                if (customerIdInput && !customerSelect?.value) customerIdInput.value = getNextCustomerId();
                customerSelect?.addEventListener('change', e => {
                    if (e.target.value) {
                        applyCustomer(e.target.value);
                    } else if (customerIdInput) {
                        customerIdInput.value = getNextCustomerId();
                        if (customerPointsInfo) customerPointsInfo.innerText = 'Customer baru. ID dibuat otomatis dan akan dikunci saat tersimpan.';
                        calculateTotal();
                    }
                });


                selectBook.addEventListener('change', (e) => {
                    const selectedOption = e.target.options[e.target.selectedIndex];
                    if(selectedOption.value !== "") {
                        inputPrice.value = selectedOption.getAttribute('data-price');
                        calculateTotal();
                    } else {
                        inputPrice.value = "";
                        labelTotal.innerText = "Rp 0";
                    }
                });

                inputPrice.addEventListener('input', calculateTotal);
                inputQty.addEventListener('input', calculateTotal);
                inputShipping.addEventListener('input', calculateTotal);
                discountInput?.addEventListener('input', calculateTotal);
                pointsInput?.addEventListener('input', calculateTotal);

                selectPay.addEventListener('change', (e) => {
                    if(e.target.value === PAYMENT_STATUS.DP) {
                        containerDp.classList.remove('hidden');
                        inputDp.setAttribute('required', 'true');
                    } else {
                        containerDp.classList.add('hidden');
                        inputDp.removeAttribute('required');
                        inputDp.value = "";
                    }
                });

                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const price = parseFloat(inputPrice.value) || 0;
                    const qty = parseInt(inputQty.value) || 1;
                    const shipping = parseFloat(inputShipping.value) || 0;
                    const calc = calculateTotal();
                    const total = calc.total;
                    const pStatus = selectPay.value;
                    let dp = 0;
                    if(pStatus === PAYMENT_STATUS.DP) dp = Math.min(total, parseFloat(inputDp.value) || 0);
                    else if(pStatus === PAYMENT_STATUS.PAID) dp = total;

                    let customerId = String(customerIdInput.value || '').trim();
                    const isExistingCustomer = !!customerSelect.value;
                    if (isExistingCustomer) {
                        const existingCustomer = getCustomerById(customerSelect.value);
                        if (!existingCustomer) { showToast('Data customer tidak ditemukan. Silakan pilih ulang.', 'error'); return; }
                        customerId = existingCustomer.id;
                    } else {
                        // ID yang tampil di form adalah kandidat/preview. ID final dibuat oleh server
                        // secara atomik saat saveOrder, sehingga tidak ada risiko bentrok antar perangkat.
                        customerId = customerId || getNextCustomerId();
                        customerIdInput.value = customerId;
                        showToast('Menyiapkan Customer ID otomatis...', 'info');
                    }

                    const newOrder = {
                        id: `ORD-PENDING-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,
                        pendingDisplayNo: (() => { assignPendingDisplayIds(); const nums = appData.orders.map(o => Number(o.pendingDisplayNo)).filter(n => Number.isFinite(n) && n > 0); const permanent = appData.orders.map(o => { const m = /^ORD-(\d+)$/.exec(String(o.id || '')); return m ? Number(m[1]) : 0; }).filter(n => n > 0); return Math.max(0, ...nums, ...permanent) + 1; })(),
                        clientRequestId: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : `REQ-${Date.now()}-${Math.random().toString(36).slice(2)}`,
                        isNewOrder: true,
                        date: document.getElementById('order-date').value || todayISO(),
                        customerId: customerId,
                        isNewCustomer: !isExistingCustomer,
                        customerName: document.getElementById('cust-name').value,
                        customerPhone: document.getElementById('cust-phone').value,
                        customerEmail: document.getElementById('cust-email').value,
                        customerAddress: document.getElementById('cust-address').value,
                        bookId: selectBook.value,
                        qty: qty,
                        unitPrice: price,
                        shippingCost: shipping,
                        subtotal: calc.subtotal,
                        discountPercent: calc.discountPercent,
                        discountAmount: calc.discountAmount,
                        pointsUsed: calc.pointsUsed,
                        pointsDiscount: calc.pointsDiscount,
                        pointsEarned: calc.pointsEarned,
                        totalPrice: total,
                        status: ORDER_STATUS.NEW,
                        paymentStatus: pStatus,
                        dpAmount: dp,
                        shippingVendor: '',
                        trackingNumber: ''
                    };

                    // Kurangi stok buku secara otomatis
                    const book = mockBooks.find(b => b.id === selectBook.value);
                    if (book) {
                        book.stock = Math.max(0, book.stock - qty);
                    }

                    appData.orders.unshift(newOrder);
                    orderHistories[newOrder.id] = {
                        transaction: [{ status: ORDER_STATUS.NEW, date: newOrder.date }],
                        payment: [{ status: PAYMENT_STATUS.UNPAID, date: newOrder.date }]
                    };
                    if (pStatus !== PAYMENT_STATUS.UNPAID) orderHistories[newOrder.id].payment.push({ status: pStatus, date: newOrder.date });
                    saveOrderHistories();
                    this.queueOrderForSync(newOrder);
                    showToast('Pesanan dibuat! Menyimpan ke Google Sheets...', 'info');
                    
                    app.navigate('orders');
                    
                    const originalLocalOrderId = newOrder.id;
                    const resOrder = await apiService.sendAction('saveOrder', newOrder);
                    if (resOrder && resOrder.status === 'success') {
                        const finalOrderId = String(resOrder.id || newOrder.id);
                        if (finalOrderId !== originalLocalOrderId) {
                            const idx = appData.orders.findIndex(o => String(o.id) === originalLocalOrderId);
                            if (idx >= 0) appData.orders[idx] = { ...appData.orders[idx], id: finalOrderId };
                            const hist = orderHistories[originalLocalOrderId];
                            if (hist) { orderHistories[finalOrderId] = hist; delete orderHistories[originalLocalOrderId]; saveOrderHistories(); }
                            if (pendingOrderSync[originalLocalOrderId]) { pendingOrderSync[finalOrderId] = { ...pendingOrderSync[originalLocalOrderId], id: finalOrderId, isNewOrder:false }; delete pendingOrderSync[originalLocalOrderId]; }
                            newOrder.id = finalOrderId;
                        }
                        if (resOrder.customerId) newOrder.customerId = resOrder.customerId;
                        newOrder.isNewCustomer = false;
                        newOrder.isNewOrder = false;
                        const localCustomerIdInput = document.getElementById('cust-id');
                        if (localCustomerIdInput && resOrder.customerId) localCustomerIdInput.value = resOrder.customerId;
                        delete pendingOrderSync[String(newOrder.id)];
                        if (Array.isArray(confirmedServerOrders)) {
                            const ci = confirmedServerOrders.findIndex(o => String(o.id) === String(newOrder.id));
                            if (ci >= 0) confirmedServerOrders[ci] = { ...newOrder }; else confirmedServerOrders.push({ ...newOrder });
                            knownServerOrderIds.add(String(newOrder.id));
                        }
                        this.saveLocalStorage();
                    }
                    let resBook = null;
                    if (book) {
                        resBook = await apiService.sendAction('saveBook', book);
                    }

                    if(resOrder && resOrder.status === 'success') {
                        const verify = await verifyOrderDateOnServer(newOrder.id, newOrder.date);
                        if (verify.ok) {
                            showToast('Pesanan, tanggal & update stok tersimpan di Google Sheets!', 'success');
                        } else {
                            showToast('Pesanan tersimpan, tetapi tanggal belum terbaca dari Google Sheets. Periksa deployment Apps Script.', 'error');
                            console.error('Verifikasi tanggal pesanan baru gagal:', verify);
                        }
                    } else {
                        showToast('Pesanan tersimpan lokal, tetapi Google Sheets menolak: ' + (resOrder?.message || 'deployment belum siap'), 'error');
                        console.error('saveOrder gagal:', resOrder);
                    }
                });
            },

function importOrdersMerge(sheet, incoming) {
  var updated = 0, added = 0, skipped = 0, errors = [], savedOrders = [];
  if (!sheet) throw new Error('Sheet Orders tidak ditemukan.');
  incoming.forEach(function(item, idx) {
    try {
      if (!item || typeof item !== 'object') { skipped++; return; }
      var order = {};
      Object.keys(item).forEach(function(k){
        if (item[k] !== undefined && item[k] !== null && String(item[k]).trim() !== '') order[k] = item[k];
      });
      var requestId = String(order.clientRequestId || '').trim();
      var existingByRequest = requestId ? findOrderByClientRequestId(sheet, requestId) : null;
      if (existingByRequest) {
        order.id = existingByRequest.id;
      }
      var rawId = String(order.id || '').trim();
      if (!rawId || /^ORD-PENDING-/i.test(rawId)) {
        order.id = reserveNextOrderId(sheet);
        order.isNewOrder = false;
      }
      order.id = String(order.id).trim().toUpperCase();
      if (!order.date) order.date = Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd');
      if (!order.customerId) order.customerId = reserveNextCustomerId(sheet);
      order.customerId = String(order.customerId).trim().toUpperCase();
      if (!order.clientRequestId) order.clientRequestId = 'IMPORT-' + new Date().getTime() + '-' + idx + '-' + Math.random().toString(36).slice(2,8);
      validateCustomerIdConsistency(sheet, order);
      var existed = orderIdExists(sheet, order.id);
      upsertRowDynamic(sheet, 'id', order.id, order);
      SpreadsheetApp.flush();
      var saved = getOrderById(sheet, order.id);
      savedOrders.push(saved || order);
      if (existed) updated++; else added++;
    } catch (err) {
      skipped++;
      errors.push('Baris ' + (idx + 2) + ': ' + err.toString());
    }
  });
  return { status:'success', updated:updated, added:added, skipped:skipped, errors:errors, orders:savedOrders };
}

function getOrderById(sheet, id) {
  var data = sheet.getDataRange().getValues();
  if (data.length <= 1) return null;
  var headers = data[0].map(function(h){return String(h).trim();});
  var idx = headers.indexOf('id');
  if (idx === -1) return null;
  for (var r=1;r<data.length;r++) {
    if (String(data[r][idx]) === String(id)) {
      var obj={};
      headers.forEach(function(h,c){
        var v=data[r][c];
        if(v instanceof Date) v=Utilities.formatDate(v, SpreadsheetApp.getActive().getSpreadsheetTimeZone(), 'yyyy-MM-dd');
        obj[h]=v;
      });
      return obj;
    }
  }
  return null;
}

function findOrderByClientRequestId(sheet, requestId) {
  requestId = String(requestId || '').trim();
  if (!requestId || sheet.getLastRow() <= 1) return null;
  var lastCol = sheet.getLastColumn();
  var headers = sheet.getRange(1,1,1,lastCol).getValues()[0].map(function(h){return String(h).trim();});
  var reqIdx = headers.indexOf('clientRequestId');
  var idIdx = headers.indexOf('id');
  var dateIdx = headers.indexOf('date');
  var custIdx = headers.indexOf('customerId');
  if (reqIdx === -1 || idIdx === -1) return null;
  var rows = sheet.getRange(2,1,sheet.getLastRow()-1,lastCol).getValues();
  for (var i=0;i<rows.length;i++) {
    if (String(rows[i][reqIdx] || '').trim() === requestId) {
      return { id:String(rows[i][idIdx] || ''), date:dateIdx === -1 ? '' : rows[i][dateIdx], customerId:custIdx === -1 ? '' : String(rows[i][custIdx] || '') };
    }
  }
  return null;
}

function repairDuplicateOrderIds(sheet) {
  var result = { repairedCount:0, duplicatesFound:0, mappings:[] };
  if (!sheet || sheet.getLastRow() <= 1 || sheet.getLastColumn() === 0) return result;
  var data = sheet.getDataRange().getValues();
  var headers = data[0].map(function(h){ return String(h).trim(); });
  var idIdx = headers.indexOf('id');
  if (idIdx === -1) return result;
  var max = 0;
  for (var r=1; r<data.length; r++) {
    var raw = String(data[r][idIdx] || '').trim().toUpperCase();
    var m = raw.match(/^ORD-(\d+)$/i);
    if (m) max = Math.max(max, parseInt(m[1],10) || 0);
  }
  var seen = {};
  for (var i=1; i<data.length; i++) {
    var original = String(data[i][idIdx] || '').trim();
    var normalized = original.toUpperCase();
    var valid = /^ORD-(\d+)$/.test(normalized);
    var needsRepair = !valid || !!seen[normalized];
    if (seen[normalized] && valid) result.duplicatesFound++;
    if (needsRepair) {
      do { max++; normalized = 'ORD-' + String(max).padStart(3,'0'); } while (seen[normalized]);
      sheet.getRange(i+1, idIdx+1).setValue(normalized);
      result.repairedCount++;
      result.mappings.push({ row:i+1, oldId:original, newId:normalized });
    } else if (original !== normalized) {
      sheet.getRange(i+1, idIdx+1).setValue(normalized);
    }
    seen[normalized] = true;
  }
  if (result.repairedCount > 0) SpreadsheetApp.flush();
  return result;
}

function reserveNextOrderId(sheet) {
  var lastRow = sheet.getLastRow(), lastCol = sheet.getLastColumn();
  var headers = lastCol ? sheet.getRange(1,1,1,lastCol).getValues()[0].map(function(h){return String(h).trim();}) : [];
  var idx = headers.indexOf('id'), max = 0;
  if (idx !== -1 && lastRow > 1) {
    sheet.getRange(2,idx+1,lastRow-1,1).getValues().forEach(function(row){
      var m = String(row[0] || '').trim().match(/^ORD-(\d+)$/i);
      if (m) max = Math.max(max, parseInt(m[1],10) || 0);
    });
  }
  var candidate;
  do { max++; candidate = 'ORD-' + String(max).padStart(3,'0'); } while (orderIdExists(sheet,candidate));
  return candidate;
}

function orderIdExists(sheet, id) {
  var lastRow=sheet.getLastRow(), lastCol=sheet.getLastColumn();
  if(lastRow<=1 || lastCol===0) return false;
  var headers=sheet.getRange(1,1,1,lastCol).getValues()[0].map(function(h){return String(h).trim();});
  var idx=headers.indexOf('id'); if(idx===-1) return false;
  var vals=sheet.getRange(2,idx+1,lastRow-1,1).getValues();
  for(var i=0;i<vals.length;i++) if(String(vals[i][0] || '')===String(id)) return true;
  return false;
}

function reserveNextCustomerId(sheet) {
  var lastRow = sheet.getLastRow();
  var lastCol = sheet.getLastColumn();
  var headers = lastCol ? sheet.getRange(1,1,1,lastCol).getValues()[0].map(function(h){return String(h).trim();}) : [];
  var idx = headers.indexOf('customerId');
  var max = 0;
  if (idx !== -1 && lastRow > 1) {
    var values = sheet.getRange(2, idx + 1, lastRow - 1, 1).getValues();
    values.forEach(function(row) {
      var id = String(row[0] || '').trim().toUpperCase();
      var match = id.match(/^CUST-(\d+)$/);
      if (match) max = Math.max(max, parseInt(match[1], 10) || 0);
    });
  }
  return 'CUST-' + String(max + 1).padStart(6, '0');
}

function validateCustomerIdConsistency(sheet, order) {
  var lastRow = sheet.getLastRow();
  var lastCol = sheet.getLastColumn();
  if (lastRow <= 1 || lastCol === 0) return;
  var headers = sheet.getRange(1,1,1,lastCol).getValues()[0].map(function(h){return String(h).trim();});
  var idIdx = headers.indexOf('customerId');
  var nameIdx = headers.indexOf('customerName');
  var phoneIdx = headers.indexOf('customerPhone');
  var orderIdIdx = headers.indexOf('id');
  if (idIdx === -1) return;
  var rows = sheet.getRange(2,1,lastRow-1,lastCol).getValues();
  for (var i=0;i<rows.length;i++) {
    var rowId = String(rows[i][orderIdIdx] || '');
    var custId = String(rows[i][idIdx] || '').trim().toUpperCase();
    if (!custId || custId !== String(order.customerId).trim().toUpperCase() || rowId === String(order.id)) continue;
    var oldName = nameIdx === -1 ? '' : String(rows[i][nameIdx] || '').trim().toLowerCase();
    var oldPhone = phoneIdx === -1 ? '' : String(rows[i][phoneIdx] || '').replace(/\D/g,'');
    var newName = String(order.customerName || '').trim().toLowerCase();
    var newPhone = String(order.customerPhone || '').replace(/\D/g,'');
    if ((oldPhone && newPhone && oldPhone !== newPhone) || (oldName && newName && oldName !== newName && !oldPhone && !newPhone)) {
      throw new Error('Customer ID ' + order.customerId + ' sudah dimiliki customer lain. Sistem menolak ID ganda.');
    }
  }
}

function ensureOrdersSchema(ss) {
  var sheet = ss.getSheetByName('Orders');
  var requiredHeaders = ['id','date','clientRequestId','customerId','customerName','customerPhone','customerEmail','customerAddress','bookId','qty','unitPrice','shippingCost','subtotal','discountPercent','discountAmount','pointsUsed','pointsDiscount','pointsEarned','totalPrice','status','paymentStatus','dpAmount','shippingVendor','trackingNumber'];
  if (!sheet) { sheet=ss.insertSheet('Orders'); sheet.appendRow(requiredHeaders); return; }
  var data=sheet.getDataRange().getValues();
  if (data.length===0 || data[0].length===0) { sheet.clear(); sheet.appendRow(requiredHeaders); return; }
  var headers=data[0].map(function(h){return String(h).trim();});
  var dateIndex=headers.indexOf('date');
  var aliasIndex=-1;
  ['tanggalPemesanan','Tanggal Pemesanan','tanggal_pemesanan'].some(function(alias){aliasIndex=headers.indexOf(alias);return aliasIndex!==-1;});
  if (dateIndex===-1) {
    var idIndex=headers.indexOf('id'); var newCol;
    if(idIndex!==-1){sheet.insertColumnAfter(idIndex+1);newCol=idIndex+2;}else{newCol=sheet.getLastColumn()+1;}
    sheet.getRange(1,newCol).setValue('date'); dateIndex=newCol-1;
    if(aliasIndex!==-1 && data.length>1){var values=data.slice(1).map(function(row){return [row[aliasIndex]||''];});if(values.length)sheet.getRange(2,newCol,values.length,1).setValues(values);}
  }
  headers=sheet.getRange(1,1,1,sheet.getLastColumn()).getValues()[0].map(function(h){return String(h).trim();});
  requiredHeaders.forEach(function(header){if(headers.indexOf(header)===-1){sheet.getRange(1,sheet.getLastColumn()+1).setValue(header);headers.push(header);}});
  var finalDateIndex=headers.indexOf('date');
  if(finalDateIndex!==-1 && sheet.getLastRow()>1) sheet.getRange(2,finalDateIndex+1,sheet.getLastRow()-1,1).setNumberFormat('yyyy-mm-dd');
}

function ensureSettingsSchema(ss){
  var sheet=ss.getSheetByName('Settings');
  if(!sheet){sheet=ss.insertSheet('Settings');sheet.appendRow(['key','value']);}
  var defaults={defaultDiscountPercent:'0',maxDiscountPercent:'20',rupiahPerPoint:'10000',pointValue:'100',pointsRedemptionEnabled:'true'};
  var data=sheet.getDataRange().getValues();
  var existing={};
  for(var i=1;i<data.length;i++){if(data[i][0]!=='' ) existing[String(data[i][0])]=i+1;}
  Object.keys(defaults).forEach(function(key){if(!existing[key])sheet.appendRow([key,defaults[key]]);});
}
function getSettings(ss){
  ensureSettingsSchema(ss); var sheet=ss.getSheetByName('Settings'); var data=sheet.getDataRange().getValues(); var out={};
  for(var i=1;i<data.length;i++){if(data[i][0]!=='' ) out[String(data[i][0])]=data[i][1];}
  return {defaultDiscountPercent:Number(out.defaultDiscountPercent||0),maxDiscountPercent:Number(out.maxDiscountPercent||20),rupiahPerPoint:Number(out.rupiahPerPoint||10000),pointValue:Number(out.pointValue||100),pointsRedemptionEnabled:String(out.pointsRedemptionEnabled)!=='false'};
}
function saveSettings(ss,obj){
  ensureSettingsSchema(ss); var sheet=ss.getSheetByName('Settings'); var data=sheet.getDataRange().getValues(); var rows={};
  for(var i=1;i<data.length;i++) rows[String(data[i][0])]=i+1;
  var values={defaultDiscountPercent:String(obj.defaultDiscountPercent||0),maxDiscountPercent:String(obj.maxDiscountPercent||0),rupiahPerPoint:String(obj.rupiahPerPoint||10000),pointValue:String(obj.pointValue||100),pointsRedemptionEnabled:String(obj.pointsRedemptionEnabled!==false)};
  Object.keys(values).forEach(function(k){if(rows[k])sheet.getRange(rows[k],2).setValue(values[k]);else sheet.appendRow([k,values[k]]);});
}
function canonicalizeOrderForFingerprint_(order){
  var out={};
  Object.keys(order || {}).sort().forEach(function(key){
    if (key === 'isNewOrder' || key === 'isNewCustomer' || key === 'pendingDisplayNo' || key === 'localChangedAt') return;
    var value = order[key];
    if (value === null || value === undefined) value = '';
    out[key] = String(value);
  });
  return out;
}
function computeOrdersFingerprint(orders){
  var canonical = (orders || []).map(function(order){ return canonicalizeOrderForFingerprint_(order); });
  canonical.sort(function(a,b){ return String(a.id || '').localeCompare(String(b.id || '')); });
  var payload = canonical.map(function(item){ return JSON.stringify(item); }).join('\u001e');
  var hash = 2166136261 >>> 0;
  for (var i=0;i<payload.length;i++) {
    hash ^= payload.charCodeAt(i);
    hash = (hash * 16777619) >>> 0;
  }
  return ('00000000' + hash.toString(16)).slice(-8);
}
function getSheetData(ss,sheetName){
  var sheet=ss.getSheetByName(sheetName); if(!sheet)return []; var data=sheet.getDataRange().getValues(); if(data.length<=1)return [];
  var headers=data[0]; var rows=[];
  for(var i=1;i<data.length;i++){var rowObj={};for(var j=0;j<headers.length;j++){var val=data[i][j];if(val instanceof Date)val=Utilities.formatDate(val,ss.getSpreadsheetTimeZone(),'yyyy-MM-dd');rowObj[String(headers[j]).trim()]=val;}rows.push(rowObj);} return rows;
}
function upsertRowDynamic(sheet,keyColumnName,keyValue,rowValuesObj){
  var data=sheet.getDataRange().getValues();
  if(data.length===0||data[0].length===0){var newHeaders=Object.keys(rowValuesObj);sheet.appendRow(newHeaders);sheet.appendRow(newHeaders.map(function(h){return rowValuesObj[h]!==undefined?rowValuesObj[h]:'';}));return;}
  var headers=data[0].map(function(h){return String(h).trim();});
  var keyIndex=headers.indexOf(keyColumnName);
  var existingIndex=-1;
  if(keyIndex!==-1&&data.length>1){for(var r=1;r<data.length;r++){if(String(data[r][keyIndex])===String(keyValue)){existingIndex=r;break;}}}
  var existingRow=existingIndex>=0?data[existingIndex]:null;
  var rowArray=headers.map(function(header,idx){
    if(rowValuesObj[header]!==undefined) return rowValuesObj[header];
    return existingRow ? existingRow[idx] : '';
  });
  if(existingIndex>=0){sheet.getRange(existingIndex+1,1,1,rowArray.length).setValues([rowArray]);return;}
  sheet.appendRow(rowArray);
}

function deleteRowById(ss,sheetName,id){var sheet=ss.getSheetByName(sheetName);if(sheet){var data=sheet.getDataRange().getValues();if(data.length<2)return;var headers=data[0];var keyIndex=headers.indexOf('id');if(keyIndex===-1)return;for(var i=data.length-1;i>=1;i--){if(String(data[i][keyIndex])===String(id))sheet.deleteRow(i+1);}}}
`

                const modalHtml = `
                    <div id="sheet-config-modal" class="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4 fade-in">
                        <div class="bg-white rounded-xl shadow-2xl w-full max-w-3xl overflow-hidden flex flex-col max-h-[90vh]">
                            <div class="p-4 border-b border-gray-200 bg-gray-900 text-white flex justify-between items-center">
                                <h3 class="font-bold text-lg flex items-center text-corp-primary"><i class="ph ph-file-spreadsheet text-2xl mr-2 text-blue-400"></i> Integrasi Google Spreadsheet YKBUT</h3>
                                <button onclick="app.closeModal()" class="text-gray-400 hover:text-white transition"><i class="ph ph-x text-xl"></i></button>
                            </div>
                            <div class="p-6 overflow-y-auto space-y-6 text-sm text-gray-700">
                                <div class="bg-blue-50 border border-blue-200 p-4 rounded-lg flex items-center justify-between">
                                    <div>
                                        <p class="text-xs text-blue-700 font-bold uppercase tracking-wider">Target Spreadsheet ID</p>
                                        <p class="font-mono text-gray-800 font-bold">${SPREADSHEET_CONFIG.TARGET_SHEET_ID}</p>
                                    </div>
                                    <a href="https://docs.google.com/spreadsheets/d/${SPREADSHEET_CONFIG.TARGET_SHEET_ID}/edit" target="_blank" rel="noopener" class="px-3 py-1.5 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition flex items-center text-xs">
                                        <i class="ph ph-arrow-square-out mr-1"></i> Buka Spreadsheet
                                    </a>
                                </div>

                                <div class="bg-gray-50 border p-4 rounded-lg">
                                    <label class="block font-bold text-gray-800 mb-1">Google Apps Script Web App URL *</label>
                                    <p class="text-xs text-gray-500 mb-3">Tempelkan Web App URL yang Anda dapatkan setelah melakukan <strong>Deploy</strong> pada Google Spreadsheet Anda.</p>
                                    <div class="flex space-x-2">
                                        <input type="text" id="input-webapp-url" value="${currentUrl}" placeholder="https://script.google.com/macros/s/.../exec" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-corp-primary outline-none font-mono text-xs">
                                        <button onclick="app.saveWebAppUrl()" class="px-4 py-2 bg-corp-primary text-white font-bold rounded-lg hover:bg-blue-800 transition">Simpan & Uji Koneksi</button>
                                         <button onclick="app.runSheetDiagnostic()" class="px-3 py-2 bg-white text-gray-700 border border-gray-300 font-semibold rounded-lg hover:bg-gray-100 transition text-xs">Diagnosa</button>
                                    </div>
                                    <div id="diagnostic-result" class="mt-3 hidden p-3 rounded-lg text-xs font-mono"></div>
                                </div>

                                <div class="border-t pt-4 space-y-3">
                                    <h4 class="font-bold text-gray-800 text-base flex items-center"><i class="ph ph-list-numbers text-xl mr-2 text-corp-primary"></i> Panduan Hubungkan Ke Spreadsheet Anda (5 Langkah):</h4>
                                    <ol class="list-decimal pl-5 space-y-2 text-xs text-gray-600 leading-relaxed">
                                        <li>Buka Google Spreadsheet Anda di atas, pilih menu <strong>Ekstensi (Extensions) &gt; Apps Script</strong>.</li>
                                        <li>Hapus kode bawaan di Apps Script, lalu <strong>salin dan tempelkan (paste) Kode Apps Script</strong> dari kotak di bawah ini. <span class="text-red-500 italic">*Kode ini sudah di-upgrade agar lebih kebal error.</span></li>

                                            <ul class="list-disc pl-4 mt-1 space-y-1 font-semibold text-gray-700">

                                                <li>Execute as (Jalankan sebagai): <span class="text-blue-600">Me (Saya)</span></li>

                document.getElementById('modal-root').innerHTML = modalHtml;

            async runSheetDiagnostic() {
                const resultDiv = document.getElementById('diagnostic-result');
                if (!resultDiv) return;
                resultDiv.classList.remove('hidden');
                resultDiv.className = 'mt-3 p-3 rounded-lg text-xs font-mono bg-blue-50 text-blue-700 border border-blue-200';
                resultDiv.innerHTML = '<i class="ph ph-spinner animate-spin mr-1"></i> Menjalankan diagnosa deployment...';
                const data = await apiService.diagnose();
                if (data && data.status === 'success') {
                    const correct = data.spreadsheetId === SPREADSHEET_CONFIG.TARGET_SHEET_ID && data.ordersSheet && data.hasDateColumn;
                    const legacySyncReady = !data.serverVersion && Number.isFinite(Number(data.ordersCount));
                    const syncReady = data.serverVersion === SERVER_EXPECTED_VERSION || legacySyncReady;
                    resultDiv.className = (correct && syncReady) ? 'mt-3 p-3 rounded-lg text-xs font-mono bg-green-50 text-green-700 border border-green-200' : 'mt-3 p-3 rounded-lg text-xs font-mono bg-amber-50 text-amber-700 border border-amber-200';
                    resultDiv.innerHTML = 'Deployment: <strong>' + ((correct && syncReady) ? 'VALID & SYNC READY' : 'PERLU DIPERBAIKI') + '</strong><br>Web App URL dipakai: ' + escapeHtml(getWebAppUrl()) + '<br>Server Version: ' + (data.serverVersion || 'Legacy V9') + '<br>Spreadsheet ID: ' + (data.spreadsheetId || '-') + '<br>Orders: ' + (data.ordersSheet ? 'ada' : 'tidak ada') + ' (' + (Number.isFinite(Number(data.ordersCount)) ? Number(data.ordersCount) : '?') + ' transaksi)<br>Kolom date: ' + (data.hasDateColumn ? 'ada' : 'TIDAK ADA') + '<br>Server Snapshot Engine: ' + (data.serverVersion === SERVER_EXPECTED_VERSION ? 'V11 fingerprint + unique ID guard' : (legacySyncReady ? 'Legacy metadata aman' : 'DEPLOYMENT LAMA/TIDAK LENGKAP')) + '<br>Header: ' + (data.headers || []).join(', ');
                } else {
                    resultDiv.className = 'mt-3 p-3 rounded-lg text-xs font-mono bg-red-50 text-red-700 border border-red-200';
                    resultDiv.innerHTML = '<i class="ph ph-x-circle mr-1"></i> ' + String(data?.message || 'Deployment tidak dapat diakses').replace(/</g,'&lt;');
                }
            },

            saveWebAppUrl() {
                const rawUrl = document.getElementById('input-webapp-url').value.trim();
                const url = rawUrl.replace(/[\s]+$/g, '');
                if (url && !isValidWebAppUrl(url)) {
                    const resultDiv = document.getElementById('diagnostic-result');
                    resultDiv.classList.remove('hidden');
                    resultDiv.className = 'mt-3 p-3 rounded-lg text-xs font-mono bg-red-50 text-red-700 border border-red-200';
                    resultDiv.innerHTML = '<i class="ph ph-x-circle mr-1"></i> Format URL Web App tidak valid. Gunakan URL yang berakhir dengan /exec.';
                    return;
                }
                localStorage.setItem('ykbut_webapp_url', url);
                
                const resultDiv = document.getElementById('diagnostic-result');
                resultDiv.classList.remove('hidden');
                
                if (url) {
                    resultDiv.className = 'mt-3 p-3 rounded-lg text-xs font-mono bg-blue-50 text-blue-700 border border-blue-200';
                    resultDiv.innerHTML = '<i class="ph ph-spinner animate-spin mr-1"></i> Menguji koneksi dengan server Apps Script...';
                    
                    fetch(url + (url.includes('?') ? '&' : '?') + 'action=diagnose&_t=' + Date.now())
                        .then(res => res.json())
                        .then(data => {
                            if(data.status !== 'success') throw new Error(data.message || 'Deployment tidak mengembalikan status success');
                            if(data.spreadsheetId !== SPREADSHEET_CONFIG.TARGET_SHEET_ID) throw new Error('Web App mengarah ke Spreadsheet ID berbeda: ' + (data.spreadsheetId || '-'));
                            if(!data.ordersSheet || !data.hasDateColumn) throw new Error('Sheet Orders atau kolom date belum tersedia pada deployment aktif.');
                            const isV11 = data.serverVersion === SERVER_EXPECTED_VERSION;
                            const isLegacyReady = !data.serverVersion && Number.isFinite(Number(data.ordersCount));
                            resultDiv.className = 'mt-3 p-3 rounded-lg text-xs font-mono ' + (isV11 ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-amber-50 text-amber-700 border border-amber-200');
                            resultDiv.innerHTML = '<i class="ph ph-check-circle mr-1"></i> ' + (isV11 ? 'Deployment V11 aktif & siap sinkronisasi authoritative dengan fingerprint + unique ID guard.' : (isLegacyReady ? 'Deployment legacy terdeteksi. Sinkronisasi authoritative tetap aman bila metadata lengkap. V11 direkomendasikan untuk unique ID guard + fingerprint.' : 'Deployment aktif, tetapi metadata snapshot belum lengkap. Gunakan Kode Apps Script V11 dari aplikasi.'));
                            showToast(isV11 ? 'Koneksi + schema + fingerprint Google Sheets tervalidasi.' : (isLegacyReady ? 'Koneksi valid. Gunakan V11 untuk unique ID guard + integrity fingerprint.' : 'Deployment perlu diperbarui.'), isV11 ? 'success' : 'info');
                            this.syncFromSpreadsheet();
                        })
                        .catch(err => {
                            resultDiv.className = 'mt-3 p-3 rounded-lg text-xs font-mono bg-red-50 text-red-700 border border-red-200';
                            resultDiv.innerHTML = '<i class="ph ph-x-circle mr-1"></i> ' + String(err.message || err).replace(/</g,'&lt;');
                        });
                } else {
                    resultDiv.className = 'mt-3 p-3 rounded-lg text-xs font-mono bg-gray-50 text-gray-700 border border-gray-200';
                    resultDiv.innerHTML = 'URL Google Sheets telah dihapus. Aplikasi berjalan dalam mode lokal offline.';
                    showToast('Web App URL dihapus. Berjalan secara lokal.', 'info');
                    this.syncFromSpreadsheet();
                }
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
